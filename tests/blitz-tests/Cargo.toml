[package]
name = "blitz-tests"
description = "Integration tests for Blitz"
publish = false
version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
categories.workspace = true
edition.workspace = true
rust-version.workspace = true

[dev-dependencies]
# Blitz dependencies
blitz-test-harness = { workspace = true }
escher-telemetry = { workspace = true }
blitz-dom = { workspace = true, features = ["accessibility", "autofocus", "floats", "system-fonts", "text-transform-icu"] }
blitz-html = { workspace = true }
blitz-traits = { workspace = true }
blitz-paint = { workspace = true, features = ["scrollbars", "svg"] }
dioxus-native-dom = { workspace = true, features = ["accessibility"] }
seven_guis = { workspace = true }
escher-driver = { workspace = true }
anyrender = { workspace = true }
anyrender_vello_cpu = { workspace = true }

# DioxusLabs dependencies
dioxus = { workspace = true }
dioxus-core = { workspace = true }

# Other dependencies
style = { workspace = true }
accesskit = { workspace = true }
markup5ever = { workspace = true }
keyboard-types = { workspace = true }
taffy = { workspace = true }
test-that = { workspace = true }
usvg = { workspace = true }
tracing = { workspace = true }
tracing-log = { workspace = true }

[lib]
path = "lib.rs"

# A standing difference from upstream, to keep at every upstream sync. Upstream (#1123) sets
# `autotests = false` in [package] and builds this one target, so every file under tests/ is a
# module of tests/all.rs. The fork declines both lines (the operator's decision, 2026-10-10):
# each file stays its own test target, and this table carries `test = false`, so tests/all.rs
# stays byte-identical to upstream's and no `cargo test` builds it.
# A merge that takes upstream's two lines breaks the a11y leg's three `--test` names
# (.github/scripts/ci-leg.sh), `scripts/agent-run.sh run {name}`, the per-target test baseline,
# and upstream's own `all_test_files_are_included`, which fails on every fork file all.rs does
# not list. Guarded by .github/scripts/test_blitz_tests_targets.py (the ci-scripts leg).
[[test]]
name = "all"
path = "tests/all.rs"
test = false
