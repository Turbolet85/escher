# Cascade step 2 — the pattern set of the 2026-10-10-driver-cli wrap, derived from every amendment of the pass.
# Each pattern is the OLD wording of an amended passage or the retired mechanism's phrasing; each fires on the
# pre-pass masters (the tool's control).

[[pattern]]
id = "wire-v1"
fixed = 'hello v1'

[[pattern]]
id = "req-64"
fixed = '64 bytes'

[[pattern]]
id = "life-only"
regex = 'lifecycle messages only|lifecycle only|lifecycle socket|lifecycle line protocol'

[[pattern]]
id = "hello-stop"
fixed = 'hello` and `stop`'

[[pattern]]
id = "in-process"
regex = 'in process only|in process, |in process:|in-process (definition|executor)'

[[pattern]]
id = "socket-none"
regex = 'crosses the socket|goes on the socket|reachable from the socket|crosses it'

[[pattern]]
id = "caller-only"
regex = 'returned to its caller only|returned value only|only exit|adds no crossing'

[[pattern]]
id = "no-cli"
regex = 'no CLI or MCP|CLI JSON|CLI and MCP planned|CLI or MCP tool'

[[pattern]]
id = "six-verbs"
regex = 'six verbs|six verb words|the six verbs|its six verbs'

[[pattern]]
id = "five-kinds"
regex = 'five argument kinds|the five kinds'

[[pattern]]
id = "ten-act"
regex = 'ten driver-action|ten `stand_act|ten files|the tenth'

[[pattern]]
id = "readers"
regex = '15 readers|fifteen readers|fifteen of the sixteen|by 15 |15 in all|four of the ten'

[[pattern]]
id = "argv-two"
regex = '<task> <state-dir>|exactly two arguments|<state-dir>'

[[pattern]]
id = "stdout-none"
regex = 'nothing (on|to) stdout|nothing to stdout|stdout empty on every path|empty stdout|nothing is written to stdout'

[[pattern]]
id = "no-expiry"
regex = 'no idle expiry|keeps running|until it is stopped|until stopped'

[[pattern]]
id = "not-measured"
regex = '[Nn]ot measured|NOT measured'

[[pattern]]
id = "provisional"
fixed = 'PROVISIONAL'

[[pattern]]
id = "two-targets"
regex = 'two integration-test targets|two seven_guis tests|by both'

[[pattern]]
id = "count-29"
regex = '29 inline|29 tests|\(29\)'

[[pattern]]
id = "count-33"
fixed = '33 names'

[[pattern]]
id = "ws-count"
regex = '719 passed|158 result'

[[pattern]]
id = "files-30"
fixed = '30 files'

[[pattern]]
id = "timer-hand"
regex = 'booted by hand only|no standing check boots'

[[pattern]]
id = "nine-mods"
fixed = 'nine private modules'

[[pattern]]
id = "one-cfg"
regex = 'one `cfg` gate'

[[pattern]]
id = "prints"
regex = 'prints nothing|no print'

[[pattern]]
id = "type-append"
regex = 'which focuses a text input|inserted inside|types into'

[[pattern]]
id = "check-dirs"
regex = '`ss-life` and `ss-quiet`|hb-serve'

[[pattern]]
id = "variants-12"
regex = 'twelfth variant|twelve variants'

[[pattern]]
id = "host-binary"
regex = 'the headless session host|the session host, a binary|the `escher-session` host'

[[pattern]]
id = "exit-one"
regex = 'exits? `?1`? (with|on) (an|the) error|exits 1 '

[[pattern]]
id = "record-len"
regex = 'recorded whole|recorded id.s length|no test of an id|no test reads an id'

[[pattern]]
id = "span-none"
regex = 'run no command|runs no command|runs none|neither binary runs|reached by no code path'

[[pattern]]
id = "eprintln3"
fixed = 'three `eprintln!`s'

[[pattern]]
id = "shifted-click"
regex = 'would land off its centre|not measured on a click'

[[pattern]]
id = "widest-87"
regex = '128 bytes|at most 128'
