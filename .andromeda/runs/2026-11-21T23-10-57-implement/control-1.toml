[[control]]
id = "sum-unchecked"
entry = 1
guard = "the sha256 comparison that guards the rename of a fetched archive into place"
case = "test_a_mismatched_archive_is_refused"

[[control.edit]]
path = ".github/scripts/skia_archive.py"
old = '''        if sha256_of(partial) != expected:
            os.remove(partial)
            print(f"skia-archive: attempt {attempt} of {ATTEMPTS} failed in verify", file=sys.stderr)
            continue
        os.replace(partial, final)'''
new = '''        os.replace(partial, final)'''

[[control]]
id = "url-unexported"
entry = 2
guard = "the leg's export of the verified archive's SKIA_BINARIES_URL (re-aimed from the FORCE export, inputs#I7)"
case = "test_skia_legs_build_from_the_verified_archive"

[[control.edit]]
path = ".github/scripts/ci-leg.sh"
old = '''    export SKIA_BINARIES_URL="$url"'''
new = '''    :'''
