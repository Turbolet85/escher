[[control]]
id = 'read-reaching-a-pass'
entry = 2
guard = 'the canvas arm reads with no pass: the edit pumps the harness before the read'
case = 'a_canvas_read_changes_nothing_with_timer_ticks_pending'

[[control.edit]]
path = 'packages/escher-driver/src/execute.rs'
old = '''            Command::Canvas { ref id, full, part } => Ok(canvas(self.canvas(id)?, full, part)),'''
new = '''            Command::Canvas { ref id, full, part } => {
                self.harness.pump();
                Ok(canvas(self.canvas(id)?, full, part))
            }'''

[[control]]
id = 'glyph-ids-written'
entry = 2
guard = 'a glyph run crosses as a digest of its ids: the edit keeps a glyph id in its place and writes it'
case = 'the_fixtures_answers_hold_no_glyph_id_and_no_text'

[[control.edit]]
path = 'packages/escher-driver/src/canvas.rs'
old = '''                ids: fnv1a(&ids),'''
new = '''                ids: run.glyphs.first().map_or(0, |glyph| u64::from(glyph.id)) + 0 * ids.len() as u64,'''

[[control.edit]]
path = 'packages/escher-driver/src/json/canvas.rs'
old = '''                let _ = write!(out, "{ids:016x}");'''
new = '''                let _ = write!(out, "{ids}");'''

[[control]]
id = 'explore-canvas-filter-removed'
entry = 1
guard = 'exploration leaves out a verb answering a canvas reading, by field kind'
case = 'the_verbs_explored_are_the_tables_target_verbs_with_no_image_no_layout_and_no_canvas_reading'

[[control.edit]]
path = 'packages/escher-driver/src/explore.rs'
old = '''                | FieldKind::Size
                | FieldKind::Commands
                | FieldKind::CommandCounts
        )'''
new = '''                | FieldKind::Size
        )'''

[[control]]
id = 'budget-doubled'
entry = 2
guard = 'the canvas cut holds each part within the budget: the edit loosens it to twice the budget'
case = 'a_full_dump_over_the_budget_reads_in_parts_each_within_it'

[[control.edit]]
path = 'packages/escher-driver/src/execute.rs'
old = '''        if index > start && size + length > SNAPSHOT_TEXT_BUDGET {'''
new = '''        if index > start && size + length > 2 * SNAPSHOT_TEXT_BUDGET {'''
