[[pattern]]
id = 'old-accent'
regex = '#4a6cf7|74, ?108, ?247|4\.39'
ignore_case = true

[[pattern]]
id = 'accent-shades'
regex = '#3a5ce5|#2a4cd3|#1f3fc1|5\.47|6\.83|8\.27'
ignore_case = true

[[pattern]]
id = 'not-met'
regex = 'is not met|not met on|five accent|accent buttons'
ignore_case = true

[[pattern]]
id = 'a11y-leg'
regex = 'accessibility_hidden|focusability_updates|6 \+ 6 \+ 4|a11y` leg|a11y leg|a11y job'
ignore_case = true

[[pattern]]
id = 'run-stand'
regex = '\b153\b'

[[pattern]]
id = 'ws-totals'
regex = '\b928\b|182 · 9'

[[pattern]]
id = 'crud-list'
regex = 'crud-list'

[[pattern]]
id = 'list-name'
regex = 'reads no accessible name|listbox reads|the name `""`|name ""'
ignore_case = true

[[pattern]]
id = 'stand-checks'
regex = 'stand_contrast|stand_keyboard|stand_accessibility_ids'

[[pattern]]
id = 'record-tally'
regex = 'pass 9|9 · 5|fail 5|five .?Fail|Fail.? rows|exempt-inactive'
ignore_case = true

[[pattern]]
id = 'legscript'
fixed = 'LegScriptTest'

[[pattern]]
id = 'adapter-tree'
regex = '&dyn Document|update_tree|author_id'

[[pattern]]
id = 'activedesc'
fixed = 'aria-activedescendant'

[[pattern]]
id = 'inert'
regex = '\binert\b'

[[pattern]]
id = 'silent-census'
regex = '\bcensus'
ignore_case = true

[[pattern]]
id = 'refresh'
regex = 'View::poll|refresh on change|windowed witness'
ignore_case = true

[[pattern]]
id = 'hover-active'
regex = ':hover|:active|hover and active|hover/active'
ignore_case = true

[[pattern]]
id = 'common-tables'
regex = 'REGION_NAMES|ENABLED_TAB_ORDER|INPUT_NAMES|TEXT_ROWS|STATE_ROWS'

[[pattern]]
id = 'route-entry'
fixed = 'Stand a11y assertions'

[[pattern]]
id = 'stand-adapter'
regex = 'builds no AccessKit|builds no platform adapter|no platform adapter|seven_guis_native'
ignore_case = true

[[pattern]]
id = 'file-counts'
regex = '`stand_keyboard` 11|`stand_contrast` 2\b|`stand_accessibility_ids` 5\b|stays three files|staying its three files'

[[pattern]]
id = 'obs-silent'
regex = 'installs no (subscriber|sink)|no subscriber|install no subscriber'
