[[pattern]]
id = 'owner-title'
fixed = 'The UI graph'
ignore_case = true

[[pattern]]
id = 'owner-generic'
regex = 'owned by a (route entry|CARRY)'
ignore_case = true

[[pattern]]
id = 'verbs'
regex = '\btwelve (verbs|tools|driver commands|MCP tools|instance and session verbs)\b|`?VERBS`?[^.\n]{0,24}\btwelve\b'

[[pattern]]
id = 'inst-verbs'
regex = '\beight (instance verbs|verbs asked of the held instance)\b|\beight are asked of the held instance\b|\beighth instance verb\b'

[[pattern]]
id = 'node-keys'
regex = '\bthirteen\b[^.\n]{0,40}\bnode keys?\b|`?NODE_FIELDS`?[^.\n]{0,30}\bthirteen\b'

[[pattern]]
id = 'readings'
regex = 'Reading::ALL`?[^.\n]{0,24}\b(eleven|11)\b|\beleven readings\b'

[[pattern]]
id = 'field-kinds'
regex = '\bten\b[^.\n]{0,24}`?FieldKind|FieldKind`?s?[^.\n]{0,30}\bten\b'

[[pattern]]
id = 'describe-row'
fixed = '[12, 13, 12, 3, 8, 4, 15]'

[[pattern]]
id = 'run-stand'
regex = '\b237\b[^.\n]{0,6}·[^.\n]{0,6}\b0\b[^.\n]{0,6}·[^.\n]{0,6}\b7\b'

[[pattern]]
id = 'cells-parts'
regex = '47,089|\b47089\b|Cells[^.\n]{0,60}\b(five|5) parts\b'

[[pattern]]
id = 'click-field'
regex = 'reacts? to a click|res-gvelrxja'
ignore_case = true

[[pattern]]
id = 'graph-token'
regex = '\bUI graph\b|`graph` verb|DioxusDocument::graph|use_graph_signal|use_graph_state|signal registry|virtual[- ]node'
ignore_case = true

[[pattern]]
id = 'dnd-units'
regex = 'dioxus-native-dom[^.\n]{0,60}\b83\b|\b83\b[^.\n]{0,20}(#\[test\]|unit tests?)'

[[pattern]]
id = 'ed-units'
regex = 'escher-driver[^.\n]{0,60}\b10[03]\b[^.\n]{0,20}(#\[test\]|unit|passed)'

[[pattern]]
id = 'stand-files'
regex = '\b51\b[^.\n]{0,12}(stand )?files\b'
