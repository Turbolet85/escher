[[pattern]]
id = 'bridge'
regex = 'DioxusDocument::snapshot|unkeyed_actionable|DioxusEventHandler'

[[pattern]]
id = 'lint-crossing'
regex = "a lint's findings"
ignore_case = true

[[pattern]]
id = 'id-tiers'
regex = 'anchored path|component path|document path'

[[pattern]]
id = 'obs-verb'
regex = '`tool`[^.\n]{0,60}`ending`|`verb`[^.\n]{0,40}`cause`'

[[pattern]]
id = 'cli-usage'
regex = 'usage line|tools/list'
ignore_case = true
