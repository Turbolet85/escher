[[pattern]]
id = 'a11y-count'
regex = '\b18 (named )?(test )?(target )?files|a11y-leg-membership|eighteen-file'

[[pattern]]
id = 'a11y-reading'
regex = '18 · 163|\b163 tests'

[[pattern]]
id = 'fixup-inert'
regex = 'is_inert\(\)`? alone|focus-fixup-reads-inert-alone|keeps focus and takes keys|no longer shows'

[[pattern]]
id = 'tab-walk'
regex = 'focus_next_node|focus_prev_node|is_focussable'

[[pattern]]
id = 'same-render'
regex = 'same render|buffered render|bridge-buffered-render|render_immediate|yield-once|busy-yield'

[[pattern]]
id = 'seed'
regex = 'Math\.random|with_seed|seeded-source|one-run-seed|no-seed-on-carriers'

[[pattern]]
id = 'boundary-reg'
regex = 'BoundaryRegistry|boundary registry|registry only grows|boundary_marks|boundary-marks'

[[pattern]]
id = 'focus-clear'
regex = 'clear_focus|give_up_unshown_focus|focus-fixup-without-events|inert-focus-fixup|inert-focus-clear-silent|programmatic-focus-events'

[[pattern]]
id = 'changed-set'
regex = 'snapshot_node_and|changed-set-marks|changed-set-write-sites'

[[pattern]]
id = 'resolve-select'
regex = 'reconcile_select_list|resolve-reconciles-select-list'

[[pattern]]
id = 'boxless'
regex = 'boxless|key_press_after_container_lost_its_box|key-after-dropped-anonymous-block'

[[pattern]]
id = 'mounted'
regex = 'mounteddata-during-render|MountedData'

[[pattern]]
id = 'engine-tally'
regex = 'hit-focus-form-engine-changes'

[[pattern]]
id = 'cap-statement'
regex = 'test_capability_statement'

[[pattern]]
id = 'removed-focus'
regex = 'removed-focused-node-drops-focus'
