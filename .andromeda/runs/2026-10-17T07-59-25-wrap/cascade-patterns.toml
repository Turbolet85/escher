[[pattern]]
id = 'zip-ign'
regex = '''Two ignores stand|Two ignores|two ignores|RUSTSEC-2026-0192|RUSTSEC-2026-036[789]|ignored by ID|ignores by ID|zip 2\.4\.2'''
