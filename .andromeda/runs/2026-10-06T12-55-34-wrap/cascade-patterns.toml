[[pattern]]
id = "written-nowhere"
regex = 'written nowhere|written to neither|written to no '

[[pattern]]
id = "only-forward"
regex = 'only forward|forwards? to blitz-dom|forwarding to the same-named'

[[pattern]]
id = "build-a11y-tree"
fixed = 'build_accessibility_tree'

[[pattern]]
id = "text-child-name"
regex = 'labelled by them|text children|label(s|led)? their parent|accessible name'
ignore_case = true

[[pattern]]
id = "aria-label"
fixed = 'aria-label'

[[pattern]]
id = "count-444"
regex = '444 passed|444 · 0'

[[pattern]]
id = "stand-20"
regex = '20 `?ok`? stand'

[[pattern]]
id = "default-feature"
regex = 'accessibility` is a default feature|default feature'
