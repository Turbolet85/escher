[[control]]
id = 'a-navigate'
entry = 4
guard = "the link arm's navigate_to call"
[[control.edit]]
path = 'packages/blitz-dom/src/events/pointer.rs'
old = '''                                doc.navigation_provider.navigate_to(NavigationOptions::new(
                                    url,
                                    None,
                                    doc.id(),
                                ));'''
new = '''                                let _ = url;'''

[[control]]
id = 'b-walk-on'
entry = 4
guard = "the walk-on to the parent after the match"
[[control.edit]]
path = 'packages/blitz-dom/src/events/pointer.rs'
old = '''            // No match. Recurse up to parent.
            maybe_node_id = doc.nodes[node_id].parent;'''
new = '''            // No match. Recurse up to parent.
            maybe_node_id = None;'''

[[control]]
id = 'c-clear-focus'
entry = 4
guard = "the clear_focus of an unmatched walk"
[[control.edit]]
path = 'packages/blitz-dom/src/events/pointer.rs'
old = '''        generate_focus_events(doc, &mut |doc| doc.clear_focus(), dispatch_event);'''
new = '''        let _ = matched;'''

[[control]]
id = 'd-disabled'
entry = 4
guard = "the is_disabled stop of the walk"
[[control.edit]]
path = 'packages/blitz-dom/src/events/pointer.rs'
old = '''            if el.is_disabled() {
                break 'matched true;
            }'''
new = '''            if el.is_disabled() {}'''

[[control]]
id = 'e-label'
entry = 4
guard = "the label arm's re-dispatch handle_click(doc, target_node_id, &syn_event, dispatch_event)"
[[control.edit]]
path = 'packages/blitz-dom/src/events/pointer.rs'
old = '''                        handle_click(doc, target_node_id, &syn_event, dispatch_event);'''
new = '''                        let _ = (target_node_id, &syn_event);'''

[[control]]
id = 'f-double-click'
entry = 4
guard = "the DoubleClick dispatch"
[[control.edit]]
path = 'packages/blitz-dom/src/events/pointer.rs'
old = '''        dispatch_event(DomEvent::new(
            target,
            DomEventData::DoubleClick(double_click_event),
        ));'''
new = '''        let _ = (target, double_click_event);'''
