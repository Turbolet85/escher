[[control]]
id = 'clip-stop-frame'
entry = 6
guard = "the clip stop's early return in Node::hit_inner answers in content-box coordinates"
case = 'a_border_hit_on_a_clipping_inline_root_reads_content_box_coordinates'

[[control.edit]]
path = 'packages/blitz-dom/src/node/node.rs'
old = '''
                return (matches_self && !pointer_events_none).then_some(HitResult {
                    node_id: self.id,
                    x: x - content_box_offset.x,
                    y: y - content_box_offset.y,
                    is_text: false,
                });'''
new = '''
                return (matches_self && !pointer_events_none).then_some(HitResult {
                    node_id: self.id,
                    x,
                    y,
                    is_text: false,
                });'''
