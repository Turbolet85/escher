# Main's own cascade patterns — 2026-11-23-canvas-in-a-headless-shot.
# The rows this pass added (architecture, security-plan, test-plan) and the report's two moved counts.

# The canvas crossing: a canvas's content as pixels in a shot (architecture, security-plan).
[[pattern]]
id = 'm-canvas'
regex = '''canvas|as pixels in a (shot|`?screenshot)|stand_canvas_shot'''
ignore_case = true

# blitz-paint's custom-widget feature, now on in the harness (architecture, security-plan).
[[pattern]]
id = 'm-cw'
regex = '''custom-widget|stand_canvas_shot'''

# The stand_* targets stand-repeat and `run stand` read — one more (report, Counts / qualifiers moved).
[[pattern]]
id = 'm-stand'
regex = '''stand_\*|`run stand`|stand_ prefix|stand_canvas_shot'''

# The declarers of `mod session_common;` — one more (report, Counts / qualifiers moved).
[[pattern]]
id = 'm-sesscommon'
regex = '''session_common'''
