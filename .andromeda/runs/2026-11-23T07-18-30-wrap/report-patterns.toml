# The site sweep of 2026-11-23-canvas-in-a-headless-shot — one pattern per moved fact of the report.

# Counts / qualifiers moved — the stand_* targets read by stand-repeat and agent-run's `run stand` gain one.
[[pattern]]
id = 'cnt-stand'
regex = '''stand_canvas_shot|stand_\*|stand_ prefix|stand-prefixed|`run stand`|stand checks'''

# Counts / qualifiers moved — the declarers of `mod session_common;` gain one.
[[pattern]]
id = 'cnt-sesscommon'
regex = '''session_common|stand_canvas_shot'''

# Expected amendment 1 — security-plan: a canvas's app-painted content crosses as pixels in a shot on every carrier.
[[pattern]]
id = 'ea-sec-canvas'
regex = '''stand_canvas_shot|canvas|app-painted|as pixels in a (shot|screenshot)'''
ignore_case = true

# Expected amendment 2 — architecture: a canvas crosses the carriers only as pixels in a screenshot.
[[pattern]]
id = 'ea-arch-canvas'
regex = '''stand_canvas_shot|canvas|leaving also as pixels|as pixels in a `?screenshot'''
ignore_case = true

# Expected amendment 3 — architecture: blitz-test-harness names blitz-paint's custom-widget.
[[pattern]]
id = 'ea-arch-cw'
regex = '''stand_canvas_shot|custom-widget|custom_widget|Widget::paint|draw_custom_widget|build_custom_widget_scenes'''

# Expected amendment 4 — security-plan dependencies: custom-widget on the harness, peniko a blitz-tests dev-dependency.
[[pattern]]
id = 'ea-sec-dep'
regex = '''stand_canvas_shot|peniko|custom-widget'''

# Expected amendment 5 — test-plan §2: the canvas shot check as the witness a widget paints in a shot.
[[pattern]]
id = 'ea-test-canvas'
regex = '''stand_canvas_shot|canvas shot|widget (paints|painted)|painted from Rust'''
ignore_case = true
