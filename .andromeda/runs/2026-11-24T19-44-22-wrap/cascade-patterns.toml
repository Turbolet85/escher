# Main's own cascade patterns — the old phrasings of this wrap's amended claims

[[pattern]]
id = 'verbs15'
regex = '\bfifteen (driver )?(verbs|tools|words)\b|\bfifteenth (tool|verb)\b|its fifteen\b|VERBS` holds fifteen|of fifteen \('
ignore_case = true

[[pattern]]
id = 'inst11'
regex = '\beleven (instance|asked)\b|\beleventh instance verb\b|11 instance verbs'
ignore_case = true

[[pattern]]
id = 'pixonly'
regex = 'only as pixels in a (shot|screenshot)|shot pixels alone|pixels alone|leaving only as shot pixels|crosses only as pixels|crossing only as pixels|carriers only as pixels'
ignore_case = true

[[pattern]]
id = 'layoutnocause'
regex = 'carries .?layout.? with no cause|five target verbs|`layout`, `layout` with no cause'
ignore_case = true
