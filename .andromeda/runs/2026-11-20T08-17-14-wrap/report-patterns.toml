[[pattern]]
id = 'outofline'
regex = '''snapshot_tests|snapshot::tests|out[- ]of[- ]line (unit[- ])?test|_tests\.rs'''

[[pattern]]
id = 'jsonfix'
regex = '''json_tests|json::tests|fixtures\.rs|fixture builders?'''

[[pattern]]
id = 'keymod'
regex = '''command::key|command/key\.rs|command::Key|Key::ALL|Key::from_name'''

[[pattern]]
id = 'oversize'
regex = '''over 800|800 code lines|800 lines|oversize|files? of ours over'''
ignore_case = true

[[pattern]]
id = 'cognitive'
regex = '''cognitive|over 15\b|complex functions?'''
ignore_case = true

[[pattern]]
id = 'coverage'
regex = '''97\.77|97\.92|90\.72|89\.91|96\.07|coverage floor|per-crate floor'''

[[pattern]]
id = 'dup'
regex = '''duplicat|jscpd|upstream-authored'''
ignore_case = true

[[pattern]]
id = 'helpers'
regex = '''read_role|read_address|run_instance|run_session|visit_roots|visit_listeners|visit_dynamic_nodes|assert_no_flag|assert_readers_agree|assert_listed_node|assert_interactive_named'''
