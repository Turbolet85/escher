[[pattern]]
id = 'front-page'
regex = '[Ff]ront [Pp]age|README\.md'

[[pattern]]
id = 'pointer-rs'
regex = 'events/pointer\.rs|events/\{pointer'

[[pattern]]
id = 'keyboard-rs'
regex = 'events/keyboard\.rs|keyboard\}\.rs|events/\{keyboard'

[[pattern]]
id = 'range-rs'
regex = 'node/range\.rs'

[[pattern]]
id = 'handlers'
regex = 'handle_click|handle_pointerdown|handle_key_or_input_event|parse_float'

[[pattern]]
id = 'complexity'
regex = 'cognitive|over-ceiling|complexity ceiling'
ignore_case = true
