# The site sweep of 2026-11-18-served-error-page — one pattern per moved fact of the report

# Counts / qualifiers moved
[[pattern]]
id = 'served7'
regex = '''six (?:served|apps|stand apps|tasks|stand tasks|lean|of the|served tasks)|seven served|\bTASKS\b|Served::|redo all six|cold-agent-six-apps'''
ignore_case = true

[[pattern]]
id = 'rows54'
regex = '''48 rows|\bROWS\b|stand_cross_os_readings'''

[[pattern]]
id = 'actboot'
regex = '''ACTIONABLE_AT_BOOT|actionable at boot'''
ignore_case = true

[[pattern]]
id = 'handlers'
regex = '''HANDLERS_AT_BOOT|handlers at boot'''
ignore_case = true

[[pattern]]
id = 'graphdrv'
regex = '''GRAPH_DRIVES'''

[[pattern]]
id = 'unexer'
regex = '''UNEXERCISED_AFTER_DRIVES'''

[[pattern]]
id = 'taborder'
regex = '''[A-Z_]*_TAB_ORDER|stated (?:tab )?order'''

[[pattern]]
id = 'capcounts'
regex = '''678 nodes|2, 7, 3, 11'''

[[pattern]]
id = 'coldtests'
regex = '''41 tests|test_cold_agent|STAND_IDS'''

# Spec claims disproved by measurement
[[pattern]]
id = 'owner'
regex = '''reached handler|caused[^.\n]*\bowner\b'''

# Expected amendments (from plan)
[[pattern]]
id = 'causedkind'
regex = '''caused_by_kind|refused_by_cause'''

[[pattern]]
id = 'capunused'
regex = '''capability-unused'''

[[pattern]]
id = 'servedtasks'
regex = '''escher-session-served-tasks|escher-session-tasks|served tasks?|cold-agent-cli'''
ignore_case = true

[[pattern]]
id = 'screenprov'
regex = '''cold-agent-screen-to-provider|cold-agent-run-carries-stand-screen|caused-text-crossing|caused. text'''

[[pattern]]
id = 'eventsmeta'
regex = '''cold-agent-events-metadata-only'''

[[pattern]]
id = 'coldtasks'
regex = '''cold-agent-tasks|cold-agent-prompt-names-no-ids|cold-agent-passes-on-positive-evidence|STAND_PROMPT'''

[[pattern]]
id = 'crossos'
regex = '''cross-os-readings-by-answer-digest|stand-readings-same-on-every-ci-os'''

[[pattern]]
id = 'exitcodes'
regex = '''escher-session-exit-codes'''

[[pattern]]
id = 'standids'
regex = '''stand-element-ids|stand-lints-clean-at-boot|order-(?:submit|retry|quantity|export|status|failed)'''

[[pattern]]
id = 'a11ystand'
regex = '''stated-tab-order-walked|stand-contrast-asserted'''

[[pattern]]
id = 'bootorder'
regex = '''boot_order|headless-stand|boot_load|boot_crud'''

[[pattern]]
id = 'isselect'
regex = '''is-select|is_select'''
