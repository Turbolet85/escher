# Main's own cascade patterns — the old wording of the amended claims, over all seven masters
[[pattern]]
id = 'main-six'
regex = '''six (?:served|apps|stand tasks|tasks|task names)|all six|\bsix of them\b'''
ignore_case = true

[[pattern]]
id = 'main-locate'
regex = '''locate alone|read by the driver's locate'''

[[pattern]]
id = 'main-capunused'
regex = '''a list (?:is )?open(?:ed|ing)? went unused|a list is opened\b'''
