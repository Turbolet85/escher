[[pattern]]
id = 'sync-head'
regex = '547d751[0-9a-f]*|165d698[0-9a-f]*|upstream sync|upstream/main|last (taken|synced) upstream commit'

[[pattern]]
id = 'left-out'
regex = '\b14 (left-out )?commits|left[- ]out (commits?|set|table|groups?)|kept out|lock\.md'

[[pattern]]
id = 'ime-target'
regex = 'ime_preedit_underline|blitz-tests targets?|one target per behaviour|test target'

[[pattern]]
id = 'e1-replace'
regex = 'classList|DOMTokenList|interfaces\.js'

[[pattern]]
id = 'e5-ime'
regex = 'composition underline|preedit|\bIME\b|input method|text_decorations'

[[pattern]]
id = 'e2-float'
regex = 'convert::float|convert::clear|float_box_inputs|logical (float|clear)|to_taffy_style|\bfloat\b'

[[pattern]]
id = 'e34-contents'
regex = 'display: ?contents|is_or_contains_block|ChildFlow|contents_holds_only_inlines'

[[pattern]]
id = 'e6-textarea'
regex = 'textarea|refresh_layout'

[[pattern]]
id = 'deny-0192'
regex = 'RUSTSEC-2026-0192|res-y4gizreq|ttf-parser'

[[pattern]]
id = 'dioxus-hold'
regex = 'Dioxus (is )?held|0\.7\.3|Dioxus 0\.8|0\.8\.0-alpha|dioxus-0-8'
