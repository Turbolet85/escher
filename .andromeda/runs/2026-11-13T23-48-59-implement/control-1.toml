[[control]]
id = 'refusal'
entry = 4
guard = "blitz-net's file: arm returns FileForbidden for a non-file initiator"

[[control.edit]]
path = 'packages/blitz-net/src/lib.rs'
old = '''                    return Err(ProviderError::FileForbidden);
'''
new = ''

[[control]]
id = 'stamp'
entry = 4
guard = "stamped_request sets the loading document as the request's initiator"

[[control.edit]]
path = 'packages/blitz-dom/src/net.rs'
old = '''    let mut req = Request::get(url).initiator(initiator.clone());
'''
new = '''    let mut req = Request::get(url);
'''

[[control]]
id = 'expect'
entry = 9
guard = "the #[expect(clippy::disallowed_methods)] above stamped_request's Request::get"

[[control.edit]]
path = 'packages/blitz-dom/src/net.rs'
old = '''    #[expect(
        clippy::disallowed_methods,
        reason = "the one Request constructor in blitz-dom: it stamps the loading document as the initiator"
    )]
'''
new = ''
