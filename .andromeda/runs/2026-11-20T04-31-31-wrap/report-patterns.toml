[[pattern]]
id = 'sc-readers'
regex = '(?:\b(?:36|44|46) (?:readers|declarers|declaring files|files declare)\b|\bmod session_common\b|session_common readers)'

[[pattern]]
id = 'dup-reading'
regex = '(?:\b4\.05\b|\b3\.74\b|jscpd|duplicat(?:ion|ed) (?:reading|lines|pairs|share)|sum_dup)'

[[pattern]]
id = 'stand-reading'
regex = '(?:\b75 pairs\b|\b870 lines\b|\b42 pairs\b|\b358 lines\b|stand reading|stand_reading|\b47 / 550\b)'

[[pattern]]
id = 'cites-moved'
regex = '(?:tests/(?:common|session_common)/mod\.rs|\bstand_(?:act_diff|act_error_text|act_errors|act_obstructed|act_scroll|act_states|act_transformed|actionable_keys|actions|layout|load_page|masks_on_new_answers|mcp_masked|mcp_tools|non_lean_tasks|order_served|replay|session_state|snapshot_parts)\b)'
