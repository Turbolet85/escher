case = 'the_graph_holds_each_virtual_node_owned_by_its_canvas'
[[control.edit]]
path = 'packages/dioxus-native-dom/src/graph.rs'
old = '''        for snapshot_node in snapshot.nodes() {'''
new = '''        for snapshot_node in snapshot
            .nodes()
            .filter(|node| !node.id.contains(crate::VIRTUAL_KEY_SEPARATOR))
        {'''

[[control]]
id = 'W3'
entry = 5
guard = "step 4's canvas lookup for a virtual id removed"
case = 'actions_lists_each_virtual_node_with_the_cause_its_call_returns'
[[control.edit]]
path = 'packages/escher-driver/src/actions.rs'
old = '''                    let element = elements.get(virtual_owner.unwrap_or(&node.id))?;'''
new = '''                    let element = elements.get(&node.id)?;'''

[[control]]
id = 'W4'
entry = 5
guard = "step 4's read of step 3's table removed"
case = 'actions_lists_each_virtual_node_with_the_cause_its_call_returns'
[[control.edit]]
