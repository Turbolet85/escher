[[control]]
id = 'W6'
entry = 5
guard = "step 5's subtraction of the canvas's bounds from at"
case = 'layout_explains_a_virtual_node_placed_by_its_app'
[[control.edit]]
path = 'packages/escher-driver/src/layout.rs'
old = '''    let at = (bounds.x - canvas_bounds.x, bounds.y - canvas_bounds.y);'''
new = '''    let at = (bounds.x, bounds.y);'''

[[control]]
id = 'W7'
entry = 5
guard = "step 3's virtual arm of the resolver click calls"
case = 'a_replayed_virtual_click_reaches_its_canvas_listener'
[[control.edit]]
