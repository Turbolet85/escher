new = '''    if !takes_virtual_id(spec) || !id.contains(VIRTUAL_KEY_SEPARATOR) || spec.name == "click" {'''

[[control]]
id = 'L1'
entry = 6
guard = "lint.rs reads a virtual id's element through its owner"
case = 'the_lint_holds_no_virtual_node'
[[control.edit]]
path = 'packages/escher-driver/src/lint.rs'
old = '''    let element = elements.get(&node.id).copied();'''
new = '''    let element = elements
        .get(node.id.split_once("///").map_or(node.id.as_str(), |(owner, _)| owner))
        .copied();'''
