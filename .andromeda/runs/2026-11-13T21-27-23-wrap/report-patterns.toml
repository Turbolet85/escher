[[pattern]]
id = 'cog-click'
regex = 'handle_click|left above (the )?(ceiling|15)|reads 97|\(97\)'

[[pattern]]
id = 'cog-exec'
regex = 'Session::execute|execute \(32\)|execute 32|execute.{0,3} reads 32'

[[pattern]]
id = 'cog-graph'
regex = 'DioxusDocument::graph|graph \(50\)|graph 50|graph.{0,3} reads 50'

[[pattern]]
id = 'ceiling-left'
regex = 'left as they are|complexity ceiling|ceiling of 15|over the ceiling|cognitive[- ]complexity'
ignore_case = true

[[pattern]]
id = 'fn-over-count'
regex = '\d+ (other )?functions? (over|above)|\d+ over the ceiling|over 15'

[[pattern]]
id = 'cda-silent'
regex = 'click_default_actions|checkable_change_event'

[[pattern]]
id = 'cites-three'
regex = '(events/pointer|escher-driver/src/execute|dioxus-native-dom/src/graph)\.rs:\d+'

[[pattern]]
id = 'unres-why'
regex = 'the one that panics|non-panicking resolver|resolve_url|unresolvable-stylesheet-href|cannot be resolved starts no load'
ignore_case = true

[[pattern]]
id = 'cov-reading'
regex = '98\.04|86\.71|96\.06|\d+/\d+ = \d+\.\d+ ?%'

[[pattern]]
id = 'own-title'
fixed = 'Cognitive load corrective'
ignore_case = true

[[pattern]]
id = 'own-generic'
regex = 'owned by a (route entry|CARRY)'
ignore_case = true
