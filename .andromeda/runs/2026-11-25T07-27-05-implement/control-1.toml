[[control]]
id = 'V1'
entry = 6
guard = "graph() skips every snapshot node whose id holds the separator"
case = 'a_declaring_canvas_puts_nothing_on_the_graph'
[[control.edit]]
path = 'packages/dioxus-native-dom/src/graph.rs'
old = '''            .filter(|node| !node.id.contains(crate::VIRTUAL_KEY_SEPARATOR))'''
new = '''            .filter(|node| !node.id.is_empty() || !node.id.contains(crate::VIRTUAL_KEY_SEPARATOR))'''

[[control]]
id = 'V2'
entry = 5
guard = "the lint's flatten skips a virtual node and its children"
case = 'the_graph_actions_and_lint_hold_no_virtual_node'
[[control.edit]]
path = 'packages/escher-driver/src/lint.rs'
old = '''    if node.id.contains(VIRTUAL_KEY_SEPARATOR) {
        return;
    }'''
new = '''    if node.id.is_empty() && node.id.contains(VIRTUAL_KEY_SEPARATOR) {
        return;
    }'''

[[control]]
id = 'V3'
entry = 5
guard = "the snapshot builder reads the place map first"
case = 'the_snapshot_reads_each_virtual_node'
[[control.edit]]
path = 'packages/dioxus-native-dom/src/snapshot.rs'
old = '''        if let Some(place) = self.places.get(&id) {'''
new = '''        if let Some(place) = self.places.get(&id).filter(|_| false) {'''

[[control]]
id = 'V4'
entry = 5
guard = "the tree pushes each virtual id onto its canvas's children"
case = 'the_tree_holds_each_virtual_node_under_its_canvas'
[[control.edit]]
path = 'packages/dioxus-native-dom/src/dioxus_document.rs'
old = '''                tree.nodes[index].1.push_child(id);'''
new = '''                let _ = index;'''

[[control]]
id = 'V5'
entry = 5
guard = "a declared-disabled virtual node is written disabled on its tree node"
case = 'a_virtual_node_is_refused_in_the_one_order'
[[control.edit]]
path = 'packages/dioxus-native-dom/src/dioxus_document.rs'
old = '''                    node.set_disabled();'''
new = '''                    let _ = &mut node;'''

[[control]]
id = 'V6'
entry = 5
guard = "page_bounds adds the canvas's border and padding"
case = 'the_snapshot_reads_each_virtual_node'
[[control.edit]]
path = 'packages/dioxus-native-dom/src/virtual_node.rs'
old = '''            x: rect.x + left + region.x,'''
new = '''            x: rect.x + region.x + 0.0 * left,'''
[[control.edit]]
path = 'packages/dioxus-native-dom/src/virtual_node.rs'
old = '''            y: rect.y + top + region.y,'''
new = '''            y: rect.y + region.y + 0.0 * top,'''

[[control]]
id = 'V7'
entry = 5
guard = "click resolves through resolve_click"
case = 'a_click_on_a_virtual_node_acts_on_its_region'
[[control.edit]]
path = 'packages/escher-driver/src/execute.rs'
old = '''    let (before, target) = resolve_click(harness, seen, id)?;'''
new = '''    let (before, target) = resolve(harness, seen, id)?;
    let _ = resolve_click;'''

[[control]]
id = 'V8'
entry = 5
guard = "resolve reads an id holding the separator not-found before the record"
case = 'the_other_id_verbs_read_a_virtual_id_not_found'
[[control.edit]]
path = 'packages/escher-driver/src/execute.rs'
old = '''    if id.contains(VIRTUAL_KEY_SEPARATOR) {
        record(seen, &screen);'''
new = '''    if id.is_empty() && id.contains(VIRTUAL_KEY_SEPARATOR) {
        record(seen, &screen);'''
