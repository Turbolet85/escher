# main's own patterns — the amended claims' old verbs and phrasings, over the whole set

[[pattern]]
id = "main-2"
fixed = "hover, active, scroll"
# the changed-set never-list's flat "scroll" before the select-list qualifier

[[pattern]]
id = "main-3"
