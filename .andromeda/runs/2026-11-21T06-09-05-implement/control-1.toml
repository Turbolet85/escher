[[control]]
id = 'ctrl-nothing'
entry = 2
guard = 'press holds the action key for ctrl: the ACTION_MODIFIER join dropped'
case = 'a_press_with_ctrl_builds_a_set_of_rows_that_are_not_adjacent'
[[control.edit]]
path = 'packages/escher-driver/src/execute.rs'
old = '''    if ctrl {
        modifiers |= ACTION_MODIFIER;
    }'''
new = '''    let _ = ctrl;'''

[[control]]
id = 'graph-uncut'
entry = 2
guard = 'graph cuts an over-budget answer: the whole graph answered whatever its size'
case = 'cells_reads_in_parts_each_within_the_budget_and_together_the_whole_graph'
[[control.edit]]
path = 'packages/escher-driver/src/execute.rs'
old = '''    if part.is_none() && whole <= SNAPSHOT_TEXT_BUDGET {'''
new = '''    if part.is_none() && whole <= SNAPSHOT_TEXT_BUDGET * 1000 {'''

