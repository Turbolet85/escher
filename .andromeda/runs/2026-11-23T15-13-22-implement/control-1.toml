[[control]]
id = 'fill-one-unit'
entry = 1
guard = 'the solid fill painted one unit off its table colour'
case = 'a_solid_fill_reads_its_table'
[[control.edit]]
path = 'tests/blitz-tests/tests/stand_canvas_cross_os.rs'
old = 'Color::from_rgb8(255, 0, 0)'
new = 'Color::from_rgb8(254, 0, 0)'

[[control]]
id = 'edge-moved'
entry = 1
guard = 'the antialiased circle centre moved a tenth of a pixel'
case = 'an_antialiased_edge_reads_its_table'
[[control.edit]]
path = 'tests/blitz-tests/tests/stand_canvas_cross_os.rs'
old = '(100.4, 50.2)'
new = '(100.5, 50.2)'

[[control]]
id = 'glyphs-resized'
entry = 1
guard = 'the canvas glyphs shaped one size up'
case = 'canvas_glyphs_read_their_table'
[[control.edit]]
path = 'tests/blitz-tests/tests/stand_canvas_cross_os.rs'
old = 'FontSize(40.0)'
new = 'FontSize(41.0)'

[[control]]
id = 'page-text-beside'
entry = 1
guard = 'page text placed beside the fill canvas, so the shot holds document text'
case = 'each_fixture_paints_a_canvas_alone'
[[control.edit]]
path = 'tests/blitz-tests/tests/stand_canvas_cross_os.rs'
old = 'object { id: "canvas-fill", style: BOX, "data": attr }'
new = '''object { id: "canvas-fill", style: BOX, "data": attr }
        p { "x" }'''
