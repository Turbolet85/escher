[[pattern]]
id = 'title'
fixed = 'Capability statement'
ignore_case = true

[[pattern]]
id = 'owner'
regex = 'owned by a (route entry|CARRY)'
ignore_case = true

[[pattern]]
id = 'readme12'
regex = '(eleven driver commands|saying eleven|README\.md:48)'
ignore_case = true

[[pattern]]
id = 'docsdir'
regex = '(docs/(architecture\.mmd|licensing\.md|parley\.md)|capabilities\.md)'
ignore_case = true

[[pattern]]
id = 'ciscripts'
regex = '(Ran 100 tests|100 tests in seven|seven test files|test_capability_statement)'
ignore_case = true

[[pattern]]
id = 'mcpcarry'
regex = 'boundary-mcp-stdio'
ignore_case = true

[[pattern]]
id = 'causes9'
regex = '(cause set \(nine\)|nine causes|causes \(nine\))'
ignore_case = true

[[pattern]]
id = 'atowner'
regex = '(windowed (AT )?witness|re-carried:0\.2\.0)'
ignore_case = true
