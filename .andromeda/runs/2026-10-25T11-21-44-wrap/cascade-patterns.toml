[[pattern]]
id = 'causes9'
regex = '(cause set \(nine\)|nine causes|causes \(nine\)|nine refusal causes)'
ignore_case = true

[[pattern]]
id = 'exec7'
regex = '(the rest, seven|seven[^.;]{0,60}by the executor|executor returns the other (seven|five))'
ignore_case = true

[[pattern]]
id = 'atowner'
regex = '((witness|adapter|assistive technolog)[^;]{0,300}\(target: next\)|re-carried:0\.2\.0)'
ignore_case = true

[[pattern]]
id = 'readme12'
regex = '(eleven driver commands|saying eleven|no build, doc or test step)'
ignore_case = true

[[pattern]]
id = 'ciscripts'
regex = '(Ran 100 tests|100 tests (in|over) seven|seven test files|discovers seven)'
ignore_case = true

[[pattern]]
id = 'carried'
regex = '''(snapshot text and screenshots|the snapshot text to the client|the snapshot's text and the diff out|snapshot text, diffs, screenshots)'''
ignore_case = true

[[pattern]]
id = 'carriedset'
regex = 'ids, (accessible )?names, (control )?values'
ignore_case = true

[[pattern]]
id = 'docstree'
regex = '^(sites|scripts)/ +'
