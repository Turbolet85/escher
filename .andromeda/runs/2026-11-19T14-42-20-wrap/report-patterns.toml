# The close's site sweep — one pattern per moved fact of the report (implement's and the close's)

# Counts / qualifiers moved 1 — the ci-scripts leg's unittest files rise by one (test_target_sweep.py)
[[pattern]]
id = 'ci-scripts-files'
regex = 'ci-scripts|test_target_sweep|unittest (contract )?files'

# Counts / qualifiers moved 2 — the fast leg gains a step after its five legs; FAST_LEGS stays five
[[pattern]]
id = 'fast-step'
regex = 'FAST_LEGS|ci-leg\.sh fast|fast leg|local pre-push gate|local-pre-push-gate|fast` leg|ci-leg-legs/fast'

# Spec claims disproved 1 — one cargo hash names a unit in all four directories; incremental/ is not keyed by it
[[pattern]]
id = 'incremental-dir'
regex = 'incremental/|target/debug/incremental|\.fingerprint'

# Spec claims disproved 2 — no Compiling line after a sweep; seven_guis and blitz-tests rebuild in place
[[pattern]]
id = 'compiling-line'
regex = '`Compiling`|Compiling line|rebuil[dt] in place'

# Spec claims disproved 3 — the deps file count unchanged across a refused sweep
[[pattern]]
id = 'deps-count'
regex = 'target/debug/deps|deps/ file'

# Expected amendments — the sweep itself (test-plan §9, obs §9, arch §Occupied Resources)
[[pattern]]
id = 'sweep'
regex = 'target-sweep|stale-hash|stale hash|build-directory lock|\.cargo-lock'

# Expected amendments — the cause measured: hashes by resolution x lockfile x toolchain
[[pattern]]
id = 'hash-cause'
regex = 'unit hash|feature resolution|four resolutions|lockfile epoch|target/ grow|growth of `?target'

# Expected amendments — test-plan decision/local-baseline gains the measured footprint
[[pattern]]
id = 'local-baseline'
regex = 'local-baseline|local baseline'

# Expected amendments — arch §Occupied Resources: the state areas beside which the sweep removes units alone
[[pattern]]
id = 'state-areas'
regex = 'run-state-areas|target/agent-run|target/cold-agent|state areas?'

# Expected amendments — security env values gain CI; the close's measured limit (CI=true rebuild)
[[pattern]]
id = 'ci-env'
regex = '`CI`|CI=true|\bCI\b (is )?(set|unset)'

# Expected amendments — security-plan's environment-value list the CI name joins
[[pattern]]
id = 'env-list'
regex = 'PAINT_TREE_BENCH_HTML|MULTI_DOC_FLAT|CARGO_TARGET_TMPDIR'

# Expected amendments — obs cleanup rows the sweep stands beside
[[pattern]]
id = 'cleanup-scoped'
regex = 'cleanup-scoped|agent-run\.sh cleanup|cold-agent\.sh cleanup'
