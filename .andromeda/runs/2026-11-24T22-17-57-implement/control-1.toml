# Step 7's one-shot controls. C1–C4 and C6 fire on the stand_canvas_lint entry (5), C5 on the escher-driver unit
# entry (4).

[[control]]
id = 'C1-ink-box'
entry = 5
guard = 'ink reads each glyph outline bounds: replaced by the glyph origin alone, so the ink box is the origins box'
case = 'a_label_past_its_region_reads_truncated_on_the_planted_page'
[[control.edit]]
path = 'packages/escher-driver/src/canvas_lint.rs'
old = '''            Some((run.transform * origin * glyph_transform).transform_rect_bbox(local))'''
new = '''            let _ = local;
            Some((run.transform * origin * glyph_transform).transform_rect_bbox(Rect::ZERO))'''

[[control]]
id = 'C2-pushed-clip'
entry = 5
guard = 'labels gives each run the clip box its pushes leave: every run given no clip'
case = 'a_label_past_its_region_reads_truncated_on_the_planted_page'
[[control.edit]]
path = 'packages/escher-driver/src/canvas_lint.rs'
old = '''            RenderCommand::GlyphRun(run) => ink(run).map(|ink| Label { ink, clip }),'''
new = '''            RenderCommand::GlyphRun(run) => ink(run).map(|ink| Label { ink, clip: clip.and(None) }),'''

[[control]]
id = 'C3-clip-region'
entry = 5
guard = 'canvas_truncations cuts the region by the element clip region: the cut removed'
case = 'a_label_past_its_region_reads_truncated_on_the_planted_page'
[[control.edit]]
path = 'packages/escher-driver/src/lint.rs'
old = '''            let region = entry.region.map(|region| own.cut(region, (true, true)));'''
new = '''            let region = entry.region.map(|_| own);'''

[[control]]
id = 'C4-pop'
entry = 5
guard = 'PopLayer pops the clip stack: the pop removed, the stack left as it is'
case = 'a_label_past_its_region_reads_truncated_on_the_planted_page'
[[control.edit]]
path = 'packages/escher-driver/src/canvas_lint.rs'
old = '''                RenderCommand::PopLayer => {
                    stack.pop();
                    None
                }'''
new = '''                RenderCommand::PopLayer => None,'''

[[control]]
id = 'C5-pop-unit'
entry = 4
guard = 'PopLayer pops the clip stack: the pop removed, the stack left as it is'
case = 'a_clip_narrows_the_box_and_its_pop_restores_the_one_beneath'
[[control.edit]]
path = 'packages/escher-driver/src/canvas_lint.rs'
old = '''                RenderCommand::PopLayer => {
                    stack.pop();
                    None
                }'''
new = '''                RenderCommand::PopLayer => None,'''

[[control]]
id = 'C6-lint-joins-canvas'
entry = 5
guard = 'readings chains the canvas labels truncations: the chain removed'
case = 'a_label_past_its_region_reads_truncated_on_the_planted_page'
[[control.edit]]
path = 'packages/escher-driver/src/lint.rs'
old = '''        .chain(labels)
'''
new = '''        .chain(labels.take(0))
'''
