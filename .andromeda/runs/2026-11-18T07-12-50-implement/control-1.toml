[[control]]
id = "a-graph-unused"
entry = 3
guard = "capability-unused reads graph_calls at 0"
case = "test_each_unused_capability_fails"
[[control.edit]]
path = "scripts/cold-agent.sh"
old = '''    if 0 in (v["lint_calls"], v["screenshot_calls"], v["advance_calls"], v["graph_calls"], v["actions_calls"],'''
new = '''    if 0 in (v["lint_calls"], v["screenshot_calls"], v["advance_calls"], v["actions_calls"],'''

[[control]]
id = "b-command-lines"
entry = 3
guard = "refusals counted by cause from the command span lines"
case = "test_refusals_are_counted_by_their_cause_from_the_command_lines"
[[control.edit]]
path = "scripts/cold-agent.sh"
old = ''' span="command" '''
new = ''' span="commandx" '''

[[control]]
id = "c-list-bounds"
entry = 3
guard = "a list opening read as an option row moved by its bounds alone"
case = "test_a_list_opening_is_read_from_the_acting_answers"
[[control.edit]]
path = "scripts/cold-agent.sh"
old = '''node.get("differs") == ["bounds"]'''
new = '''node.get("differs") == ["selected"]'''

[[control]]
id = "d-prompt-graph"
entry = 3
guard = "the prompt asks for the counter's UI graph"
case = "test_the_prompt_names_no_stand_id"
[[control.edit]]
path = "scripts/cold-agent.sh"
old = '''1. Counter: the display reads 3. Before acting, read its UI graph.'''
new = '''1. Counter: the display reads 3.'''
