[[control]]
id = 'digest-flip'
entry = 1
guard = "the committed digest table: the counter's boot snapshot digest's last hex digit flipped"
case = 'the_counter_reads_its_table'
[[control.edit]]
path = 'tests/blitz-tests/tests/stand_cross_os_readings.rs'
old = '("counter", "boot", "snapshot", 0, 0x5802032aa3564184),'
new = '("counter", "boot", "snapshot", 0, 0x5802032aa3564185),'

[[control]]
id = 'font-reach'
entry = 1
guard = "the stand's bundled font: its font context replaced by the default context (host system fonts)"
case = 'the_counter_reads_its_table'
[[control.edit]]
path = 'examples/seven_guis/src/stand.rs'
old = '    build_single_font_ctx(crate::DEJAVU_SANS)'
new = '''    let _ = build_single_font_ctx;
    FontContext::default()'''

[[control]]
id = 'serif-append'
entry = 3
guard = "build_single_font_ctx's Serif append: the bundled font no longer registered for serif"
case = 'serif_reads_the_bundled_font'
[[control.edit]]
path = 'packages/blitz-dom/src/lib.rs'
old = '''        GenericFamily::SansSerif,
        GenericFamily::Serif,
        GenericFamily::Monospace,'''
new = '''        GenericFamily::SansSerif,
        GenericFamily::Monospace,'''
