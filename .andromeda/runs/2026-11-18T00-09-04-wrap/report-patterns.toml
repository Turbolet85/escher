# Wrap P1 site sweep — one pattern per moved fact of the report (Counts / qualifiers moved, Expected amendments).
# Spec claims disproved: both are no master site (a ledger ref · a plan entry).

[[pattern]]
id = 'sweep-tests'
regex = 'stand_requirement_sweep|requirement sweep|0\.2\.0 table|0\.3\.0 table'

[[pattern]]
id = 'named-17'
regex = 'STAND_REPEAT_NAMED|\b10 named|\b17 named|named blitz-tests targets'

[[pattern]]
id = 'stand-files'
regex = 'stand_masks_on_new_answers|\b63 `?stand_|\b64 `?stand_|stand_\*\.rs'

[[pattern]]
id = 'session-common'
regex = 'mod session_common|session_common` readers|\b42 (targets|readers|files)'

[[pattern]]
id = 'agent-run'
regex = 'run stand`?[^.\n]{0,60}\b(262|327|332)\b|run all`?[^.\n]{0,60}\b(743|874|879)\b|Proof reading'

[[pattern]]
id = 'doc-loader'
regex = 'document_loader'

[[pattern]]
id = 'arm-read'
regex = 'stand-repeat\)|stand-repeat`? arm|leg check'

[[pattern]]
id = 'silent'
regex = 'silent check'

[[pattern]]
id = 'mask-carrier'
regex = 'mask-holds-on-every-carrier'

[[pattern]]
id = 'coverage'
regex = '97\.73|90\.53|95\.99|5687|4457|1078/'
