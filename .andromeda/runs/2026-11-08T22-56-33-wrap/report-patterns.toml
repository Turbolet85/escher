# Wrap P1 site sweep — 2026-11-08-handler-coverage. One pattern per claim: its wording, then its name token.

[[pattern]]
id = 'owner-title'
fixed = 'Handler coverage'
ignore_case = true

[[pattern]]
id = 'owner-generic'
regex = 'owned by a (route entry|CARRY)'
ignore_case = true

# F1 — session_common declarers 34 → 35
[[pattern]]
id = 'sc-readers'
regex = '34 readers|thirty-fourth|session_common'

# F2 — blitz-tests `common` declarers 23 → 24
[[pattern]]
id = 'cm-declarers'
regex = '23 declarers|mod common;'

# F3 — cli_tests' line table 102 → 109 rows
[[pattern]]
id = 'cli-rows'
regex = '102 rows|cli_tests'

# F4 — cli_commands' usage rows 9 → 10 and its test count 17 → 18
[[pattern]]
id = 'cli-cmds'
regex = 'a_line_that_is_no_command_is_a_usage_error|cli_commands'

# F5 — host_log's tests 5 → 6, one coverage run at trace
[[pattern]]
id = 'host-log'
fixed = 'host_log'

# F6 — the stand reading 244 · 0 · 7 over 52 files → 262 · 0 · 7 over 54
[[pattern]]
id = 'stand-read'
regex = '244 · 0 · 7|52 files|run stand'

# F7 — stand_replay 3 → 4 tests, the kept actions step replayed
[[pattern]]
id = 'replay-tests'
regex = 'stand_replay|Check::replay'

# F8 — seven_guis common's needle readers gain coverage_needles
[[pattern]]
id = 'needles'
regex = 'actions_needles|graph_needles'

# F9 — escher-driver re-exports Coverage, HandlerRef, handler_coverage
[[pattern]]
id = 'drv-reexport'
regex = 'handler_coverage|HandlerRef|re-export'

# F10 — dioxus-native-dom: ReachedHandler, record_reached, reached_handlers, the record on handle_event
[[pattern]]
id = 'reached'
regex = 'ReachedHandler|record_reached|reached_handlers|handle_event'

# F11 — the command line's roles: serve, mcp, now coverage; check files named on argv
[[pattern]]
id = 'roles'
regex = 'host role|mcp role|coverage role|MCP role'

# F12 — a kept check named on the command line, read by Check::from_bytes
[[pattern]]
id = 'from-bytes'
fixed = 'Check::from_bytes'

# F13 — the crate-private ungated listener reader beside element_facts
[[pattern]]
id = 'elem-facts'
regex = 'element_facts|element_listener_ids'

# F14 — the canvas limit, 0.4.0 extending the count
[[pattern]]
id = 'canvas'
regex = 'inside a canvas|canvas'
ignore_case = true

# F15 — the stopPropagation limit
[[pattern]]
id = 'stopprop'
fixed = 'stopPropagation'

# F16 — design-system / layout-templates cli items
[[pattern]]
id = 'cli-items'
regex = 'cli-graph|cli-output|cli-actions'

# F17 — the screens-spanned decision, PROVISIONAL at test-plan §5
[[pattern]]
id = 'provisional'
fixed = 'PROVISIONAL'

# F18 — the new coverage check, its name token
[[pattern]]
id = 'shc'
fixed = 'stand_handler_coverage'
