# Wrap P1 site sweep — 2026-11-23-canvas-shot-across-hosts
# shotos: the no-shot cross-OS rule and its reason (a shot's bytes differ between OSes / byte-identical on one host)
[[pattern]]
id = 'shotos'
regex = '''PNG bytes differ|bytes differ between|differ between linux|byte[- ]identical (across processes )?on one host|byte[- ]identical on one host only|holds? no .?screenshot.? step|no .?screenshot.? step|no shot|stand_canvas_cross_os'''
ignore_case = true

# stand70: the stand_* file count 69 -> 70
[[pattern]]
id = 'stand70'
regex = '''\b(69|70|sixty-nine|seventy) .?stand_|stand_\*\.rs'''
ignore_case = true

# canvasonly: the canvas-only exception / canvas shot digests across hosts
[[pattern]]
id = 'canvasonly'
regex = '''canvas[- ]only|canvas shot|canvas's (app-painted )?content|cross-OS digests'''
ignore_case = true
