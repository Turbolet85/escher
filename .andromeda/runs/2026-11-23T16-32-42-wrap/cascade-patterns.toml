# Main's own patterns — the amended claim: a shot's PNG bytes differ by OS (now: a shot holding document text alone),
# and the no-shot cross-OS rule (now: with a canvas-only exception)
[[pattern]]
id = 'm-bytesdiffer'
regex = '''PNG bytes differ|bytes differ between|differ between linux|differ by OS|byte[- ]identical (across processes )?on one host|byte[- ]identical on one host only'''
ignore_case = true

[[pattern]]
id = 'm-noshotxos'
regex = '''compared byte for byte across OSes|cross-OS byte[- ]?(check|comparison)s?[^.]{0,60}no (shot|screenshot)|holds? no .?screenshot.? step|no shot in cross-OS'''
ignore_case = true
