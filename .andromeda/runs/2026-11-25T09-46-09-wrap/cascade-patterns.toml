# Cascade step 2 — the old phrasings of the claims this wrap's row sets rescoped (every rows-land dry run printed `patterns: none`).

# «no served id holds ///» / «no carrier serves it» / «no tier produces» — the reserved form now served (F3 A)
[[pattern]]
id = 'SERVEDFORM'
regex = '(?i)no served id holds|no carrier serves|no tier produces|which no tier|produced in process only|nothing produces it'

# «no snapshot, graph, canvas answer, accessibility tree or MCP result holds a declared node» — the absence retired
[[pattern]]
id = 'NOCARRIER'
regex = '(?i)(snapshot|accessibility tree|MCP result)[^.]{0,80}holds? a (canvas.s )?declared (virtual )?node|holds? a canvas.s declared virtual node'

# «marks and signals nothing yet» / «left to the first reader that refreshes» — F11 A, the decision settled
[[pattern]]
id = 'MARKSYET'
regex = '(?i)signals nothing yet|marks and signals nothing|first reader that refreshes'
