[[pattern]]
id = 'answer-set'
regex = '''ANSWER_HIDDEN_FIELDS|scrub(bed)? by field name|scrub-by-field-name|same (scrub )?set|(eleven|twelve) (content )?(field )?names|CONTENT_FIELDS'''

[[pattern]]
id = 'error-field'
regex = '''error=\[redacted\]|`error`[^.\n]{0,60}\[redacted\]|caused-text-crossing|field named .?error'''

[[pattern]]
id = 'act-error-text'
regex = '''stand_act_error_text'''

[[pattern]]
id = 'telemetry-lib'
regex = '''escher-telemetry --locked --lib|escher-telemetry lib tests|\b2[56] passed\b'''

[[pattern]]
id = 'doc-leg'
regex = '''ci-leg\.sh doc|doc leg|rustdoc-warnings-are-errors|RUSTDOCFLAGS|private[_ ]intra[_ ]doc[_ ]links'''
