[[control]]
id = "blend-normal"
entry = 10
guard = "convert_blend_mode's result at the blend layer, forced to the default (Normal) blend"

[[control.edit]]
path = "packages/blitz-paint/src/render.rs"
old = '''        let blend = convert_blend_mode(effects.mix_blend_mode);'''
new = '''        let blend = {
            let _ = convert_blend_mode(effects.mix_blend_mode);
            BlendMode::default()
        };'''

[[control]]
id = "own-box-always"
entry = 11
guard = "the paints_own_box gate, forced true for an inline box of blocks"

[[control.edit]]
path = "packages/blitz-paint/src/render.rs"
old = '''        let paints_own_box = !node.is_inline_with_only_block_children();'''
new = '''        let paints_own_box = true;'''

[[control]]
id = "wpt-pin-tag"
entry = 2
guard = "one wpt.yml pin set back to its tag: the SHA pin of actions/checkout"

[[control.edit]]
path = ".github/workflows/wpt.yml"
old = '''      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5'''
new = '''      - uses: actions/checkout@v5'''
