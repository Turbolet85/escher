# Main's own patterns — the retired mechanism of decision/skia-default-build-fetch, its claim's verbs and phrasings.

[[pattern]]
id = 'main-skia-nochk'
regex = '''no content check|no checksum|without (a )?checksum|unverified (prebuilt|archive|binaries)|fetching prebuilt binaries|fetches prebuilt binaries'''
ignore_case = true
