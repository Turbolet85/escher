[[pattern]]
id = 'main-click-one'
regex = '''one verb taking a virtual|only `?click`? takes|verb other than click;|verb but `?click`?[,;]|but `?click`?, which'''

[[pattern]]
id = 'main-excepted'
regex = '''a virtual node excepted|which it excepts|virtual node is never listed'''

[[pattern]]
id = 'main-hold-none'
regex = '''exploration hold none|actions answer, lint, canvas answer'''
