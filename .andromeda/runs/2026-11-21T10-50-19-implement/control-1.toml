[[control]]
id = 'fixup-uncalled'
entry = 3
guard = 'the post-layout focus fixup is never called from resolve'
case = 'a_focused_control_that_stops_showing_gives_focus_up_with_no_blur'
[[control.edit]]
path = 'packages/blitz-dom/src/resolve.rs'
old = '''
        self.give_up_unshown_focus();
'''
new = '''
'''

[[control]]
id = 'vis-unread'
entry = 3
guard = 'the shows reading drops its visibility arm'
case = 'a_focused_control_that_stops_showing_gives_focus_up_with_no_blur'
[[control.edit]]
path = 'packages/blitz-dom/src/node/node.rs'
old = '''
            && !self.under_display_none()
            && self.primary_styles().is_some_and(|computed| {
                computed.clone_visibility() == style::computed_values::visibility::T::Visible
            })
'''
new = '''
            && !self.under_display_none()
'''

[[control]]
id = 'seed-unread'
entry = 2
guard = 'the seeded Math.random returns 0.5 in place of its stream value'
case = 'seed_zero_twice_reads_one_sequence'
[[control.edit]]
path = 'packages/blitz-vibey-script/src/runtime.rs'
old = '''    Ok(JsValue::from(unit_interval(next)))'''
new = '''    Ok(JsValue::from(0.5))'''

[[control]]
id = 'prune-uncalled'
entry = 1
guard = 'the registry prune is never called before the render'
case = 'twenty_remounts_keep_the_registry_bounded'
[[control.edit]]
path = 'packages/dioxus-native-dom/src/dioxus_document.rs'
old = '''
        crate::boundary::prune_dropped_boundaries(&self.vdom);
'''
new = '''
'''

[[control]]
id = 'tab-next-unshown'
entry = 3
guard = 'focus_next_node no longer skips an unshown node'
case = 'tab_and_shift_tab_skip_a_control_that_does_not_show'
[[control.edit]]
path = 'packages/blitz-dom/src/document.rs'
old = '''
        let id = self.next_node(&self.nodes[focussed_node_id], |node| {
            node.is_focussable() && node.shows()
        })?;
'''
new = '''
        let id = self.next_node(&self.nodes[focussed_node_id], |node| node.is_focussable())?;
'''

[[control]]
id = 'tab-prev-unshown'
entry = 3
guard = 'focus_prev_node no longer skips an unshown node'
case = 'tab_and_shift_tab_skip_a_control_that_does_not_show'
[[control.edit]]
path = 'packages/blitz-dom/src/document.rs'
old = '''
        let id = self.prev_node(&self.nodes[focussed_node_id], |node| {
            node.is_focussable() && node.shows()
        })?;
'''
new = '''
        let id = self.prev_node(&self.nodes[focussed_node_id], |node| node.is_focussable())?;
'''
