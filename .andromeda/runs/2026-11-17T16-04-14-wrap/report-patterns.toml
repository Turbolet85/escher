[[pattern]]
id = 'tally-fast'
regex = '15[0-9][0-9] passed|1547|workspace test tally|stand_act_scroll'

[[pattern]]
id = 'tally-runall'
regex = '87[0-9] passed|run all|fragment_navigation|percentage_height_scroller'

[[pattern]]
id = 'ci-scripts'
regex = 'Ran 1[0-9][0-9]|test_ci_workflows|test methods'

[[pattern]]
id = 'free-disk'
regex = 'free-disk|free_disk|frees disk|frees_disk|free disk|df -h|only-stand-repeat-frees-disk|free-disk-only-on-stand-repeat'

[[pattern]]
id = 'left-out'
regex = '\b(112|102|97) (carried|left out|commits)|left-out delta|left out of|upstream-sync-merge-base|ea07ee716|e5305a4c1'

[[pattern]]
id = 'advisories'
regex = 'RUSTSEC-2026-0367|RUSTSEC-2026-0429|zip 2\.4|zip 9|res-h7acz56c|advisory ignores|ignored by ID'

[[pattern]]
id = 'svg-fetch'
regex = '<use>|svg_href|feImage|SVG <image>|SVG image|fetch_image|load_image|parse_svg'

[[pattern]]
id = 'scroll-clamp'
regex = 'clamp_node_scroll_offset|scroll clamp|clamp_viewport_scroll|reset_node_scroll_state|scroll_viewport_by|scroll range'

[[pattern]]
id = 'cargo-update'
fixed = 'cargo update -w'

[[pattern]]
id = 'anyrender'
regex = 'anyrender|vello[-_ ]hybrid|VelloHybrid|vello-gpu|vello 0\.1[0-9]|usvg|wgpu_context|AntiAliasing'

[[pattern]]
id = 'skrifa'
regex = 'skrifa|read-fonts|harfrust|font-deps-match-renderers'

[[pattern]]
id = 'dep-set'
regex = 'upstream-sync-dependency-set|enters no package|no package enter|packages? entering'

[[pattern]]
id = 'crud-clamp'
regex = 'crud-list'

[[pattern]]
id = 'oblique'
regex = 'oblique|italic shear|synthetic italic|skew'

[[pattern]]
id = 'per-os'
regex = 'per-OS|1468|1543 passed'
