[[pattern]]
id = 'm-hlunread'
regex = 'in no snapshot and no tree|in no snapshot|contrast is unread|highlight is unread|contrast unread'

[[pattern]]
id = 'm-marks'
regex = 'highlight or a wheel move|a highlight move marks nothing|list moves? marks? nothing'

[[pattern]]
id = 'm-fontclip'
regex = 'authored font clips|font on one line|larger authored font'

[[pattern]]
id = 'm-counts'
regex = 'fourteen keys|fourteen node keys|twelve variants|eight fields in the order'

[[pattern]]
id = 'm-actdesc'
regex = 'no active descendant|reads no aria-activedescendant|aria-activedescendant'

[[pattern]]
id = 'm-onereader'
regex = 'one contrast reader|the harness.s text contrast|contrast reader reads'
