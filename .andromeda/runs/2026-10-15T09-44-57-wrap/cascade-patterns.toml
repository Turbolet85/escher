# Cascade step-2 sweep of this wrap's P2 — the retired claims of every amendment of the pass (the cold-agent pipe's
# stub era), by token and by the mechanism's own phrasing.

[[pattern]]
id = 'stub'
regex = '''cold_agent_stub|mcp__stub|stub-state|calls\.jsonl|final_count|stdio stub|the stub|`stub`|stub's|stub copy|copy of the stub|stub tools|real stub'''

[[pattern]]
id = 'stub-tools'
regex = '''`list` · `read` · `press`|`list`, `read`, `press`|not-pressable|toy counter'''

[[pattern]]
id = 'task-counter'
regex = '''run counter|the one task `counter`|TASKS=\(counter\)|task `counter`'''

[[pattern]]
id = 'budget-1'
regex = '''max-budget-usd 1\b|max-budget-usd`? ?1\)|\$1 cap'''

[[pattern]]
id = 'count-27'
regex = '''ColdAgentStubTest|test_cold_agent\.py's 27|test_cold_agent\.py, 27|ColdAgentPipeTest` \(21\)'''

[[pattern]]
id = 'ci-94'
regex = '''94 tests|Ran 94|leg runs 94'''

[[pattern]]
id = 'census-3'
regex = '''three scripts|pipe or its stub'''

[[pattern]]
id = 'one-run'
regex = '''the one recorded live run|its own count at 3'''
