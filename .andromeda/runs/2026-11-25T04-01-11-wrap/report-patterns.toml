# Wrap P1 site sweep — one pattern per moved fact of implement's report (Counts / qualifiers moved,
# Expected amendments) and the two CARRYs this entry closes.

[[pattern]]
id = 'vn-form'
regex = '''produced by nothing|nothing produces|virtual[- ]node[- ]id|virtual_node_id|virtual-node-form|\{owner\}///\{key\}|reserved (id )?form|holds `///`|///'''

[[pattern]]
id = 'vn-decl'
regex = '''virtual_nodes|VirtualNodeDeclaration|VirtualNodes|virtual nodes?|declared[- ]nodes?|Virtual nodes declared'''
ignore_case = true

[[pattern]]
id = 'vn-ungated'
regex = '''signal_registry|accessibility-feature-gating|ungated'''

[[pattern]]
id = 'vn-role'
regex = '''second role mapping|role mapping|accesskit::Role|AccessKit's `Role`'''

[[pattern]]
id = 'vn-invalid'
regex = '''changed-set-write-sites|changed-set-marks|changed[- ]set write sites?|invalidation'''

[[pattern]]
id = 'vn-debug'
regex = '''debug-types-never-logged|never logged|derive `?Debug'''

[[pattern]]
id = 'vn-snapmodel'
regex = '''snapshot-model-single-source|readers-of-one-snapshot-model|single snapshot model|one snapshot model'''

[[pattern]]
id = 'dnd-unit'
regex = '''dioxus-native-dom('s)? unit|dioxus-native-dom unit tests?|unit tests? (of|in) dioxus-native-dom|element_id tests'''

[[pattern]]
id = 'vn-target'
regex = '''virtual_nodes_declared|blitz-tests targets?|test targets? (count|pin)'''

[[pattern]]
id = 'reexport'
regex = '''re-?exports? by an explicit list|explicit (re-?export )?list|pub use custom_widget'''

[[pattern]]
id = 'vn-widget'
regex = '''Widget::|widget-trait|nodes-widgets|custom[- ]widget'''

[[pattern]]
id = 'vn-bridge'
regex = '''dioxus-bridge|DioxusDocument::'''

[[pattern]]
id = 'vn-accesskit'
regex = '''accesskit|AccessKit'''

[[pattern]]
id = 'one-host'
regex = '''no-screenshot-step-in-committed-checks|one host|byte-identical across processes'''
