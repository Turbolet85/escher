# Main's own cascade patterns: the old phrasings of the claims this wrap rescoped.

[[pattern]]
id = 'm-unproduced'
regex = '''produced by nothing|which no tier produces|no tier produces|nothing produces|no producer'''

[[pattern]]
id = 'm-onehost'
regex = '''repeatability is asserted on one host|asserted on one host only|screenshot repeatability'''

[[pattern]]
id = 'm-noreader'
regex = '''is no reader of the snapshot model|draw commands, is no reader'''

[[pattern]]
id = 'm-slashslash'
regex = '''only (an anchored path|id) hold(s|ing) `?//`?|the only id holding'''
