# Cascade step 2 — the pattern set of the 2026-10-09T19-17-00 0-pending wrap.
# Derived from its nine body amendments: the two PROVISIONAL records of 2026-10-07-driver-command-spans
# (the sink's closed-span line · the diff's three list lengths on the command span) ratified by the founder.
# Every pattern is the retired mark's wording or the mechanism it stated.

[[pattern]]
id = "mark"
fixed = 'PROVISIONAL'

[[pattern]]
id = "not-yet"
fixed = '''not yet the founder's word'''

[[pattern]]
id = "batch"
fixed = '''founder's batch'''

[[pattern]]
id = "boundary"
fixed = 'Epoch 4 boundary'

[[pattern]]
id = "kept-marked"
fixed = 'kept marked'

[[pattern]]
id = "owns-mark"
regex = 'owns the mark|marks it|marks the closed span'

[[pattern]]
id = "op-answer"
fixed = '''on the operator's answer'''

[[pattern]]
id = "beside"
regex = 'stated beside the ratified sentence|which is not reworded'

[[pattern]]
id = "no-log"
fixed = 'no log, event, socket or file'

[[pattern]]
id = "lengths"
regex = 'list lengths|lengths of (its|a|the returned) diff'

[[pattern]]
id = "second-class"
regex = '[Ss]econd record class|the second class'
