[[control]]
id = 'popup-gate'
entry = 2
guard = 'select_list_allowed reads a list box as able to hold a list'
case = 'a_size_write_turns_a_drop_down_into_a_list_box_and_back'

[[control.edit]]
path = 'packages/blitz-dom/src/document.rs'
old = '&& select::is_drop_down(element)'
new = '&& select::is_single_select(element)'

[[control]]
id = 'selectedness'
entry = 2
guard = 'the selectedness setting algorithm picks a first option whatever the display size'
case = 'a_sized_single_select_with_nothing_chosen_reads_no_value'

[[control.edit]]
path = 'packages/blitz-dom/src/node/select.rs'
old = '(display_size == 1)'
new = '(display_size > 0)'

[[control]]
id = 'row-hints'
entry = 2
guard = 'the single list box rows hints are never written'
case = 'a_sized_single_select_is_a_list_box_of_its_rows'

[[control.edit]]
path = 'packages/blitz-dom/src/stylo/presentational_hints.rs'
old = 'let list_box_rows = crate::node::select::is_single_list_box(elem).then(|| {'
new = 'let list_box_rows = false.then(|| {'

[[control]]
id = 'bridge-closed'
entry = 2
guard = 'closed_select_of reads a single list box as a closed select'
case = 'a_click_on_a_sized_single_selects_row_is_accepted_and_chooses_it'

[[control.edit]]
path = 'packages/dioxus-native-dom/src/snapshot.rs'
old = '(!doc.is_list_box(select) && doc.open_select() != Some(select)).then_some(select)'
new = '(doc.open_select() != Some(select)).then_some(select)'
