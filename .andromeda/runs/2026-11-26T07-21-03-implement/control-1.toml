[[control]]
id = 'C1'
entry = 6
guard = 'the disc-holds-the-point select arm of the canvas onclick removed, so every click adds'
case = 'a_click_on_a_circle_node_selects_it_and_adds_none'
[[control.edit]]
path = 'examples/seven_guis/src/tasks/circle_drawer.rs'
old = 'if let Some(id) = hit {'
new = 'if let Some(id) = hit.filter(|_| false) {'

[[control]]
id = 'C2'
entry = 6
guard = 'the later-node clause of covered removed'
case = ['a_circle_under_a_later_one_is_refused_covered', 'a_later_square_s_corner_covers_where_its_disc_does_not']
[[control.edit]]
path = 'packages/escher-driver/src/execute.rs'
old = 'if covered(harness, target, page) || covered_by_later_node(harness, target) {'
new = 'if covered(harness, target, page) || (false && covered_by_later_node(harness, target)) {'

[[control]]
id = 'C3'
entry = 6
guard = 'every circle declared disabled false'
case = 'an_open_dialog_disables_every_other_circle'
[[control.edit]]
path = 'examples/seven_guis/src/tasks/circle_drawer.rs'
old = 'disabled: self.adjusting.is_some_and(|a| a != c.id),'
new = 'disabled: self.adjusting.is_some_and(|a| a != c.id) && false,'

[[control]]
id = 'C4'
entry = 8
guard = 'the canvas tabindex removed'
case = 'circle_drawer_walks_its_stated_sequence_and_holds_the_canvas_across_an_arrow'
[[control.edit]]
path = 'examples/seven_guis/src/tasks/circle_drawer.rs'
old = '''                tabindex: "0",
                "data": canvas,'''
new = '''                "data": canvas,'''

[[control]]
id = 'C5'
entry = 7
guard = 'the virtual branch of the snapshot reads selected as the default again'
case = 'a_declared_selected_reads_in_the_tree_the_snapshot_and_a_diff'
[[control.edit]]
path = 'packages/dioxus-native-dom/src/snapshot.rs'
old = '''                        selected: tree_node.is_selected(),
                        invalid: tree_node.invalid().is_some(),
                        focused: id == self.focus,
                        ..NodeState::default()'''
new = '''                        invalid: tree_node.invalid().is_some(),
                        focused: id == self.focus,
                        ..NodeState::default()'''

[[control]]
id = 'C6'
entry = 6
guard = 'the set_focus call at the end of the canvas onclick removed'
case = 'a_click_focuses_the_canvas_and_a_press_acts_on_its_circle'
[[control.edit]]
path = 'examples/seven_guis/src/tasks/circle_drawer.rs'
old = 'drop(handle.set_focus(true));'
new = 'let _ = &handle;'

[[control]]
id = 'C7'
entry = 9
guard = 'the engine Tab arm after a custom widget hears the key removed (the operator, inputs#I7)'
case = 'tab_and_shift_tab_leave_a_focused_widget_which_still_hears_them'
[[control.edit]]
path = 'packages/blitz-dom/src/events/mod.rs'
old = '''            && key.key == keyboard_types::Key::Named(keyboard_types::NamedKey::Tab)'''
new = '''            && key.key == keyboard_types::Key::Named(keyboard_types::NamedKey::Tab)
            && false'''
