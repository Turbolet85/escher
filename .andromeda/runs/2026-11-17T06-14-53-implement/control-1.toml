[[control]]
id = 'a-named-child'
entry = 3
guard = 'the named-child mount: the component renders as the vdom root itself'
case = 'the_shell_given_the_stands_props_reads_the_stands_counter_node_for_node'

[[control.edit]]
path = 'packages/blitz-test-harness/src/harness.rs'
old = '''    let child = move || props().into_vcomponent(component.clone());
    VirtualDom::new_with_props(
        alone_root,
        AloneRoot {
            child: Rc::new(child),
        },
    )
'''
new = '''    let _ = alone_root;
    let props = Rc::new(props);
    let root = move |_: ()| component.rebuild((*props)());
    VirtualDom::new_with_props(root, ())
'''

[[control]]
id = 'b-timer-ticks'
entry = 3
guard = "the isolated root's TimerTicks context"
case = 'the_timer_alone_reads_its_ticks_from_the_root_context'

[[control.edit]]
path = 'examples/seven_guis/src/stand.rs'
old = '''    let vdom = vdom_alone(component, props).with_root_context(TimerTicks::default());'''
new = '''    let vdom = vdom_alone(component, props);'''
