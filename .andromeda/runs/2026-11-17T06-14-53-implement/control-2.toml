[[control]]
id = 'c-root-fallback'
entry = 1
guard = "boundary_marks()' fallback insert of the root boundary"
case = 'a_document_built_after_the_first_build_reads_the_root_boundarys_error'

[[control.edit]]
path = 'packages/dioxus-native-dom/src/boundary.rs'
old = '''            contexts.insert(0, root.clone());'''
new = '''            let _ = root;'''
