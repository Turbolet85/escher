[[control]]
id = "painted-read"
entry = 2
guard = "the lint reads the highlighted row's painted pair through highlight_contrast"
case = "an_open_lists_highlighted_row_reads_its_painted_pair_and_plain_rows_their_own"

[[control.edit]]
path = "packages/escher-driver/src/lint.rs"
old = '''
    let reading = harness
        .highlight_contrast(element)
        .or_else(|| harness.text_contrast(element))?;
'''
new = '''
    let reading = harness.text_contrast(element)?;
'''

[[control]]
id = "row-height"
entry = 2
guard = "the open list's row height is the tallest row's line"
case = "every_row_takes_the_tallest_rows_line_so_a_larger_font_is_not_cut"

[[control.edit]]
path = "packages/blitz-dom/src/document.rs"
old = '''
            tallest / scale + 2.0 * ROW_PADDING_Y,
'''
new = '''
            f64::from(line.height()) / scale + 2.0 * ROW_PADDING_Y,
'''

[[control]]
id = "active-desc"
entry = 2
guard = "the single select names its highlighted option as its active descendant"
case = "an_open_list_names_its_highlighted_option_as_the_selects_active_descendant"

[[control.edit]]
path = "packages/blitz-dom/src/accessibility.rs"
old = '''
                    builder.set_active_descendant(NodeId(current.as_u64()));
'''
new = '''
                    let _ = current;
'''

[[control]]
id = "move-marks"
entry = 2
guard = "a key's highlight move marks the changed set"
case = "the_keys_move_the_highlight_over_enabled_rows_and_choose_nothing"

[[control.edit]]
path = "packages/blitz-dom/src/document.rs"
old = '''
            list.current = Some(option);
            self.changed_nodes.insert(list.select);
'''
new = '''
            list.current = Some(option);
'''

[[control]]
id = "cells-selected"
entry = 2
guard = "Cells' current cell states aria-selected"
case = "the_current_cell_alone_reads_selected_and_an_arrow_moves_it"

[[control.edit]]
path = "examples/seven_guis/src/tasks/cells.rs"
old = '''
                                    aria_selected: is_current.then_some("true"),
'''
new = '''
'''
