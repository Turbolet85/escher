[[control]]
id = "d-own-boundary"
entry = 2
guard = "the page's own error boundary takes Submit's Err"
case = "each_control_answers_what_it_caused"

[[control.edit]]
path = "examples/seven_guis/src/tasks/order.rs"
old = '''                ErrorBoundary {
                    handle_error: |errors: ErrorContext| rsx! {
                        p { id: "order-failed", class: "order-failed", "Order failed" }
                        button {
                            id: "order-retry",
                            class: "order-btn",
                            onclick: move |_| errors.clear_errors(),
                            "Retry"
                        }
                    },
                    OrderSubmit { quantity, placed }
                }
'''
new = '''                OrderSubmit { quantity, placed }
'''
