[[pattern]]
id = 'diskread'
regex = '''`?file:`? URLs?[^\n]{0,20}(?:are )?read (?:from )?disk|reads `?file:`? URLs? from disk'''

[[pattern]]
id = 'scriptonly'
regex = '''only for a `?file:`? document|only from a `?file:`? document|loading document is itself a `?file:`? document'''

[[pattern]]
id = 'pngdecode'
regex = '''decodes? a PNG'''

[[pattern]]
id = 'fileurl'
regex = '''file-url-load-rule|url-scheme-routing|file-urls?-only|file-script-load-refused|no-file-loads-from-non-file-documents'''
