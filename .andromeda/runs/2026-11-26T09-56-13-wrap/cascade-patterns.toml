# Main's own cascade patterns — the amended claims' OLD phrasings and mechanisms (every rows-land dry run of this
# wrap printed `patterns: none`).

[[pattern]]
id = 'covered-only'
regex = 'covered only (by|when)|only by an element|never by another node of its canvas|only when an element lies over'

[[pattern]]
id = 'no-kbd-route'
regex = 'no keyboard route|keyboard route to a canvas|reached by click, tree and snapshot alone|keyboard-virtual-nodes'

[[pattern]]
id = 'vn-no-selected'
regex = 'value, selected or pressed|no selected'

[[pattern]]
id = 'sel-aria-only'
regex = 'written only where the element states it'

[[pattern]]
id = 'apart-clicking'
regex = 'rather than clicking'

[[pattern]]
id = 'canvas-node-old'
regex = 'keyed and clickable'

[[pattern]]
id = 'decl-fields-old'
regex = 'BoundingRect and a disabled flag'

[[pattern]]
id = 'colours-old'
regex = 'alpha 38/255, are constants'

[[pattern]]
id = 'tab-order-old'
regex = 'the load page and Cells state their Tab order'
