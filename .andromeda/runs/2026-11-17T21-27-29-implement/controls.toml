[[control]]
id = 'leg-arm'
entry = 2
guard = 'the membership check reads the stand-repeat arm alone: inert_subtree dropped from the arm while the a11y line keeps it'
case = 'every_0_2_0_requirement_names_its_witness_inside_stand_repeat'
[[control.edit]]
path = '.github/scripts/ci-leg.sh'
old = 'stand+=(--test inert_subtree --test accessibility_states'
new = 'stand+=(--test accessibility_states'

[[control]]
id = 'named-17'
entry = 2
guard = 'STAND_REPEAT_NAMED holds the seventeen: open_state dropped from the arm'
case = 'every_0_2_0_requirement_names_its_witness_inside_stand_repeat'
[[control.edit]]
path = '.github/scripts/ci-leg.sh'
old = '--test open_state --test checkable_change_event'
new = '--test checkable_change_event'

[[control]]
id = 'row-030'
entry = 2
guard = 'a 0.3.0 witness test is found in its carried file: one renamed to a name no file holds'
case = 'every_0_3_0_requirement_names_its_witness_inside_stand_repeat'
[[control.edit]]
path = 'tests/blitz-tests/tests/stand_requirement_sweep.rs'
old = '"the_counter_reads_its_table",'
new = '"the_counter_reads_no_table_at_all",'

[[control]]
id = 'mask'
entry = 3
guard = 'the snapshot masks a password and a file input value: the mask arm disabled'
case = ['the_graph_actions_and_layout_answers_hold_no_masked_value', 'a_kept_check_holds_no_masked_value_and_replays', 'over_mcp_the_file_inputs_value_reads_the_mask']
[[control.edit]]
path = 'packages/dioxus-native-dom/src/snapshot.rs'
old = 'Some(text) if masked && !text.is_empty()'
new = 'Some(text) if false && !text.is_empty()'

[[control]]
id = 'shell-provider'
entry = 1
guard = 'make_doc_config carries the root shell provider: its line deleted'
case = 'config_carries_the_root_shell_provider'
[[control.edit]]
path = 'apps/browser/src/document_loader.rs'
old = '''        shell_provider: Some(consume_context::<Arc<dyn ShellProvider>>()),
'''
new = ''

[[control]]
id = 'html-parser'
entry = 1
guard = 'make_doc_config carries an html parser provider: its line deleted'
case = 'config_carries_an_html_parser_provider'
[[control.edit]]
path = 'apps/browser/src/document_loader.rs'
old = '''        html_parser_provider: Some(Arc::new(HtmlProvider)),
'''
new = ''

[[control]]
id = 'font-ctx'
entry = 1
guard = 'make_doc_config carries the font context: its line deleted'
case = 'config_carries_the_font_context'
[[control.edit]]
path = 'apps/browser/src/document_loader.rs'
old = '''        font_ctx: Some(font_ctx),
'''
new = ''

[[control]]
id = 'abort-signal'
entry = 1
guard = 'make_doc_config carries the passed abort signal: its line deleted'
case = 'config_carries_the_passed_abort_signal'
[[control.edit]]
path = 'apps/browser/src/document_loader.rs'
old = '''        abort_signal,
'''
new = ''

[[control]]
id = 'style-threading'
entry = 1
guard = 'make_doc_config runs style in parallel: its line deleted'
case = 'config_runs_style_in_parallel'
[[control.edit]]
path = 'apps/browser/src/document_loader.rs'
old = '''        style_threading: StyleThreading::Parallel,
'''
new = ''
