[[pattern]]
id = 'caused'
regex = '`caused`|\bCaused\b|CausedKind|CausedLevel|\bCAUSED\b|caused: Vec'

[[pattern]]
id = 'acting-fields'
regex = 'five acting verbs|acting verbs?.{0,20}result fields|result fields'

[[pattern]]
id = 'field-kinds'
regex = 'field kinds|field_kinds|argument and result shapes'

[[pattern]]
id = 'drv-tests'
regex = '\b120 (lib |unit )?tests|escher-driver.{0,10}lib unit tests'

[[pattern]]
id = 'tel-tests'
regex = '\b15 (lib |unit )?tests|escher-telemetry.{0,10}(lib )?unit tests'

[[pattern]]
id = 'reached-tests'
regex = 'reached::|boundary::|take_step_reached|step list|ReachedRecord'

[[pattern]]
id = 'json-table'
regex = 'written-form table|written forms? table|json\.rs'

[[pattern]]
id = 'targets'
regex = 'stand_act_errors|blitz-tests targets|stand_ prefix'

[[pattern]]
id = 'explore-path'
regex = 'path-ending|path ending|panicked step|\bPanicked\b|exploration-checks'

[[pattern]]
id = 'fw-targets'
regex = 'FRAMEWORK_TARGET_PREFIXES|generational_box|framework.{0,10}targets?|every target outside'

[[pattern]]
id = 'err-boundary'
regex = 'ErrorBoundary|root_error_mark|RootErrorMark|error boundar|root boundary'

[[pattern]]
id = 'dispatcher'
regex = 'thread_local|one-dispatcher|dispatcher pair|scoped dispatcher|capture dispatcher|twin dispatcher'

[[pattern]]
id = 'drv-edge'
regex = 'escher-driver (→|->|takes|depends on) escher-telemetry|escher_driver.{0,20}escher_telemetry'

[[pattern]]
id = 'envfilter'
regex = 'EnvFilter|with_filter|contract/telemetry/init|telemetry-sink/rust-log'

[[pattern]]
id = 'no-sink'
regex = 'headless-stand-no-sink|installs-no-subscriber|installs no subscriber|CaptureLayer|escher_telemetry::capture'

[[pattern]]
id = 'prov-f1'
regex = 'PROVISIONAL|state: provisional|delegate.{0,20}F1'
