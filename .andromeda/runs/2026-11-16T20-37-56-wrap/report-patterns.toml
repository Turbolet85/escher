[[pattern]]
id = 'content-fields'
regex = 'CONTENT_FIELDS|content fields?\b|\b11 (content )?(field )?names|scrub set|telemetry-scrub-set'
ignore_case = true

[[pattern]]
id = 'caused-shape'
regex = '\bcaused\b[^\n]{0,120}(\bcount\b|kind and level|closed kind)|caused-answer-crossing|acting-verb-results'
ignore_case = true

[[pattern]]
id = 'caused-past'
regex = 'caused_past|CAUSED_KEPT|CHAIN_KEPT'

[[pattern]]
id = 'subscriber'
regex = 'escher_telemetry::subscriber|fn subscriber|filtered_subscriber|CaptureLayer'

[[pattern]]
id = 'capture-count'
regex = 'count-only|counts? (of )?the (app.s )?(warn|error)|capture-framework-targets-warn-up|Captured\b|scoped log capture'
ignore_case = true

[[pattern]]
id = 'boundary'
regex = 'root_error_mark|RootErrorMark|boundary_marks|BoundaryRegistry|BoundaryMark|root-error-mark|root-boundary-err'

[[pattern]]
id = 'panic-hook'
regex = 'panic hook|panic_hook|telemetry_panic_hook|driver-library-side-effect-free'
ignore_case = true

[[pattern]]
id = 'engine-sites'
regex = 'TRACING_COMPILED|engine-target-field-allowlist|direct-engine-changes-flagged-upstreamable|interpolat'
ignore_case = true

[[pattern]]
id = 'stand-no-sink'
regex = 'headless-stand-no-sink|stand_act_error_text|capture_panic_hook'

[[pattern]]
id = 'driver-units'
regex = '\b121 (unit )?tests|\b121 passed|escher-driver[^\n]{0,40}\b121\b'

[[pattern]]
id = 'telem-units'
regex = 'escher-telemetry[^\n]{0,60}\b21\b|\b21 (unit )?tests'

[[pattern]]
id = 'field-kinds'
regex = 'field-kind table|\b30 rows'
ignore_case = true

[[pattern]]
id = 'mcp-decode'
regex = 'mcp_result_text|tool_result_carries|stand_act_errors'

[[pattern]]
id = 'mask-carrier'
regex = 'mask-holds-on-every-carrier|no-screen-content-in-logs|driver-spans-only|escher-driver-spans-ungated|accessibility-feature-gating'
