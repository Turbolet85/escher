[[pattern]]
id = 'arg-rows'
regex = '\b11 argument rows\b|argument rows|none_is_an_argument_name'

[[pattern]]
id = 'press-ctrl'
regex = '(?i)(holds|carr(y|ies|ying)|takes) no Ctrl|needs Ctrl|which this verb does not carry|--ctrl|--shift|a_press_with_ctrl'

[[pattern]]
id = 'graph-part'
regex = '(?i)unpaged|not paged|graph --part|graph in parts|whole and unpaged|the_whole_cells_answer|cells_reads_in_parts|\{"nodes":\[…\],"states":\[…\]\}'

[[pattern]]
id = 'spans-calls'
regex = '\b40 (driven )?calls\b|stand_act_spans'

[[pattern]]
id = 'cov-stop'
regex = '(?i)stopPropagation|stop_propagation|stopped (bubbling )?dispatch|bubbling dispatch|counts? (its )?ancestors|reached record|record_reached'

[[pattern]]
id = 'plain-arrow'
regex = 'row 3 alone|fx-rows|fx-three'

[[pattern]]
id = 'cells-enter'
regex = 'cells-grid|cell-input|keyed_open|an_enter_the_cell_editor'

[[pattern]]
id = 'drop-guard'
regex = '(?i)PendingWrite|drop guard|unwinds? out of'

[[pattern]]
id = 'max-part'
regex = 'MAX_PART|ArgKind::Part'
