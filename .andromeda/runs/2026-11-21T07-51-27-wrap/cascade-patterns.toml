[[pattern]]
id = 'm-noctrl'
regex = '(?i)(carr(y|ies|ying)|holds|takes) no Ctrl|non-adjacent rows of a multiple select cannot|--shift is bare|press --key \[--shift\](?! \[--ctrl\])'

[[pattern]]
id = 'm-unpaged'
regex = '(?i)graph[^.]{0,80}\bunpaged\b|graph[^.]{0,40}takes no argument|graph[^.]{0,40}no argument|read whole; dispatches|An argument to graph is refused'

[[pattern]]
id = 'm-ancestors'
regex = '(?i)counts every ancestor listener|stopPropagation[` ]*(is )?(not read|unread)|ahead of the handler|before the event runs|recorded by its stable id before the handlers run'
