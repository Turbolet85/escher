[[control]]
id = 'paint-size'
entry = 3
guard = "the content-box paint size, put back to upstream's border-box reading"
case = 'a_padded_widget_paints_its_content_box'

[[control.edit]]
path = 'packages/blitz-paint/src/lib.rs'
old = '''    let (width, height) = content_box_paint_size(node, scale);'''
new = '''    let width = (node.final_layout().size.width as f64 * scale) as u32;
    let height = (node.final_layout().size.height as f64 * scale) as u32;'''

[[control]]
id = 'paint-origin'
entry = 3
guard = "the scene placed inside the element's transform, put back to the output-axes translation"
case = 'a_transformed_widget_paints_inside_its_transform'

[[control.edit]]
path = 'packages/blitz-paint/src/render.rs'
old = '''self.transform.pre_translate(Vec2 { x, y });'''
new = '''self.transform.then_translate(Vec2 { x, y });'''

[[control]]
id = 'pointer-frame'
entry = 4
guard = "the widget's content-box event frame, put back to the border-box origin"
case = 'a_padded_widget_hears_pointer_events_from_its_content_box'

[[control.edit]]
path = 'packages/blitz-dom/src/events/mod.rs'
old = '''map_dom_event_to_ui_event(event, content_origin, viewport_scroll)'''
new = '''map_dom_event_to_ui_event(event, pos, viewport_scroll)'''

[[control]]
id = 'font-handoff'
entry = 5
guard = "the hand-off of the document's font context before each paint, removed"
case = 'canvas_text_is_shaped_from_the_documents_own_fonts'

[[control.edit]]
path = 'packages/blitz-paint/src/lib.rs'
old = '''    widget_data.widget.fonts(&fonts);
'''
new = ''
