[[pattern]]
id = 'act14'
regex = 'fourteen (driver-action|`stand_act_\*`)|six of the fourteen'

[[pattern]]
id = 'label-input'
regex = 'first nested `?<input>|`for`-target `<input>`|bound input|names the `<input>`'

[[pattern]]
id = 'aria-every'
regex = 'aria-selected[^|]{0,200}(on every element|on any element)|(on every element|on any element)[^|]{0,120}aria-selected'

[[pattern]]
id = 'hidden-excl'
regex = '`display: none`[^|]{0,80}exclud|excluded from the accessibility tree'

[[pattern]]
id = 'sc27'
regex = 'by 27\b|27 readers|twenty-seven checks|by 27 checks'

[[pattern]]
id = 'fx21'
regex = '21 readers|by 21 \(20|21 checks declare|by 21 checks — 20'

[[pattern]]
id = 'bt141'
regex = '141 `\.rs` files|140 test targets'

[[pattern]]
id = 'stand46'
regex = '46 files|46 `stand_'

[[pattern]]
id = 'run185'
regex = '185 · 0 · 7|passed 185'

[[pattern]]
id = 'tally1062'
regex = '202 · 1062|1062 passed'

[[pattern]]
id = 'acclabel10'
regex = 'accessibility_label`?,? 10|accessibility_label`.s 10'

[[pattern]]
id = 'other-elem'
regex = 'click on any other element'

[[pattern]]
id = 'provisional'
fixed = 'PROVISIONAL'

[[pattern]]
id = 'fromstr'
regex = 'maps `composition` to `Ime`'

[[pattern]]
id = 'typehelp'
regex = '`type`.s help'

[[pattern]]
id = 'snap18'
regex = 'eighteen on the snapshot|73 unit tests'

[[pattern]]
id = 'select'
regex = 'select_value|stand_act_select|select_interaction|`select`'
