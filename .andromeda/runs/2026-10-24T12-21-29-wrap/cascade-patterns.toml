[[pattern]]
id = 'ex-panic'
regex = 'cannot be resolved panics|preact_script'

[[pattern]]
id = 'env-list'
fixed = 'PAINT_TREE_BENCH_HTML'

[[pattern]]
id = 'hit-walk'
regex = 'hit_inner|positive-z hoisted|hit-testing walks'

[[pattern]]
id = 'tokio'
regex = 'RUSTSEC-2026-0386|tokio 1\.53|tokio = "1\.42"'

[[pattern]]
id = 'kbd-compat'
regex = 'until upstream retires it|keyboard_compat'

[[pattern]]
id = 'replaced'
regex = 'compute_replaced_layout|Degenerate aspect ratios'

[[pattern]]
id = 'node-fields'
regex = 'node module re-exports|is_out_of_flow|ElementData::is_disabled\(&self\)'
