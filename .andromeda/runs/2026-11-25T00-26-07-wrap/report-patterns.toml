# Phase 1 site sweep — one pattern per moved fact of 2026-11-24-canvas-lint
[[pattern]]
id = 'canvas-lint-test'
regex = 'stand_canvas_lint|canvas lint'
ignore_case = true

[[pattern]]
id = 'lint-truncated'
regex = 'lint-verb/truncated|\btruncated\b'

[[pattern]]
id = 'lint-finding'
regex = 'lint-verb/finding|one finding per defect'

[[pattern]]
id = 'lint-verb'
regex = 'driver-verbs/lint|the `?lint`? verb'

[[pattern]]
id = 'label-region'
regex = "label's region|clip, layer or mask|canvas content box|content box cut"

[[pattern]]
id = 'skrifa'
regex = 'skrifa'
ignore_case = true

[[pattern]]
id = 'canvas-crossing'
regex = 'canvas-content-crossing|glyph id, glyph position'

[[pattern]]
id = 'lint-closed'
regex = "lint-findings-closed-content|a lint's findings"

[[pattern]]
id = 'canvas-no-span'
regex = 'canvas-read-opens-no-span'

[[pattern]]
id = 'cd-pixels-only'
regex = 'circle-drawer-canvas-pixels-only|reach no[^.]{0,60}lint'

[[pattern]]
id = 'cd-circles'
regex = 'circle-drawer-circles-painted-on-canvas'

[[pattern]]
id = 'lints-clean'
regex = 'stand-lints-clean-at-boot|0 findings at boot'
