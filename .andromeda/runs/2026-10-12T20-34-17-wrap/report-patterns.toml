# Wrap P1 site sweep — 2026-10-12-headless-screenshot: one pattern per count or site claim the report states.

[[pattern]]
id = 'verbs10'
regex = '\bten (driver )?verbs\b|\bten tools\b|\bthe ten verbs\b'

[[pattern]]
id = 'inst6'
regex = '\bsix instance[- ]level verbs\b|\bsix (instance )?verbs\b|\bsix are asked\b|\bsix asked of\b|\bthe six instance verbs\b'

[[pattern]]
id = 'causes8'
regex = '\beight (refusal )?causes\b|\bthe eight covered\b|\ball eight\b'

[[pattern]]
id = 'kinds9'
regex = '\bfield kinds\b|\bnine (result[- ])?field kinds\b'

[[pattern]]
id = 'modules13'
regex = '\bthirteen private modules\b|\bmodules thirteen\b'

[[pattern]]
id = 'drvdeps4'
regex = '\bdepends on four crates\b|\bfour dependencies\b'

[[pattern]]
id = 'screenshot'
fixed = 'screenshot'
ignore_case = true

[[pattern]]
id = 'textblock'
regex = '\bone text block\b|\bone `text` block\b|\ba text block\b'

[[pattern]]
id = 'readers18'
regex = '\b(18|eighteen) readers\b'

[[pattern]]
id = 'stand131'
regex = '\bpassed 131\b|\b131 passed\b|\bover 34 files\b'

[[pattern]]
id = 'targets110'
regex = '\b110 `\.rs` files\b|\b109 test targets\b|\b110 and 109\b'

[[pattern]]
id = 'pwclear'
regex = '\bin the clear\b|\bpainted masked\b|\bpaints? masked\b'
