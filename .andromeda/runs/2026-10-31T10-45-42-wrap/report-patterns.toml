[[pattern]]
id = 'stand-repeat'
regex = 'stand-repeat|ten named|fifteen named|ten further named'
ignore_case = true

[[pattern]]
id = 'rs-files'
regex = '\b148\b|148 .?\.rs|148 files'

[[pattern]]
id = 'ws-tally'
regex = '209 · 1125|\b1125\b|214 · 1181'

[[pattern]]
id = 'a11y-tally'
regex = '14 · 85|\b85 tests|\b85 passed|fourteen .{0,60}\b85\b'
