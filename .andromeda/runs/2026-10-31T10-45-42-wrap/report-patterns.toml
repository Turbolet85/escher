# The site sweep of wrap P1, 2026-10-31-engine-debts: one pattern per claim, its wording and its name token.

[[pattern]]
id = 'owner-title'
fixed = 'Engine debts'
ignore_case = true

[[pattern]]
id = 'owner-generic'
regex = 'owned by a (route entry|CARRY)'
ignore_case = true

[[pattern]]
id = 'visible-region'
regex = 'visible_region|untransformed|transformed scrolling box|reads_outside_its_visible_region|padding_box_in_view'

[[pattern]]
id = 'non-invertible'
regex = 'non-invertible|scale\(0\)|matrix\(0|hit_non_invertible_transform'

[[pattern]]
id = 'focus-fixup'
regex = 'focus fixup|focus-fixup|keeps focus until focus moves|keeps it until focus moves|removing_inert_restores_focus'
ignore_case = true

[[pattern]]
id = 'tree-focus'
regex = '''tree's focus|tree focus|names? a node the tree|the tree names|the_tree_focus_falls_back'''
ignore_case = true

[[pattern]]
id = 'native-toggled'
regex = 'native checkbox or radio|native checkedness|native control|is_native_checkable|reading neither|writes no .toggled.|native .{0,40}toggled'
ignore_case = true

[[pattern]]
id = 'multiple-select'
regex = '''multiple. select|select_values|select_cursor|press_multiple_select_key|click_select_row|apply_select_choice|set_select_choice|select_value\b|not modelled|BaseDocument::select_value'''

[[pattern]]
id = 'optgroup'
regex = 'optgroup|select_of\b|select_parent|owner_select|option_disabled'

[[pattern]]
id = 'popup'
regex = 'popup'
ignore_case = true

[[pattern]]
id = 'option-click'
regex = 'option (is )?not clicked|an option not clicked|click on one is refused|fx-apple'

[[pattern]]
id = 'lint-overlap'
regex = '''flight-type-one-way|\[0, 1, 0, 0\]|option overlap|options? overlap|flight booker one|one .overlap.|select's options as overlapping'''

[[pattern]]
id = 'change-event'
regex = '''DomEventKind::Change|DomEventData::Change|fires? no engine .change.|engine .change.|target_is_checkbox_or_radio|checkable_change_event|a checkbox, radio or text input|synthesi[sz]'''

[[pattern]]
id = 'text-range-limit'
regex = 'text_range_no_change_event|text input.{0,60}\bchange\b|range.{0,40}no .change.'

[[pattern]]
id = 'load-rows'
regex = 'load-fetch|LOAD_TAB_ORDER|OPEN gap|the pages the stand serves beside'

[[pattern]]
id = 'cells-grid'
regex = 'cells-grid|CELLS_TAB_ORDER|cell-input|current cell|Cells.{0,60}(Tab|keyboard)|selected cell'

[[pattern]]
id = 'cells-676'
