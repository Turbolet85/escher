# Wrap P1 site sweep — 2026-11-07-mounteddata-buffered-render. One pattern per moved fact, its name token beside its
# wording; two owner patterns last.

[[pattern]]
id = 'hazard'
regex = 'MountedData hazard|RefCell already borrowed|already borrowed|hazard pages?|render_immediate'
ignore_case = true

[[pattern]]
id = 'buffer'
regex = 'mutation_buffer|MutationBuffer|mutation buffer|buffered render|buffered mutations'
ignore_case = true

[[pattern]]
id = 'unit-count'
regex = '\b8[23] unit tests'

[[pattern]]
id = 'pins'
regex = 'should_panic|spawned_panics|spawned_acts|press_with_spawned_focus|hazard pins?|inverts? the pin'
ignore_case = true

[[pattern]]
id = 'probe'
fixed = 'dioxus_runtime_probe'

[[pattern]]
id = 'witness'
regex = 'task_polled_during_render_can_access_document|task polled during render|upstream.s regression test'
ignore_case = true

[[pattern]]
id = 'mounted-evt'
regex = 'element_removed_before_its_mounted_event_is_flushed|mounted-event test'
ignore_case = true

[[pattern]]
id = 'dioxus-08'
regex = '286874cc1|0\.8\.0-alpha|Dioxus 0\.8|0\.8 move'
ignore_case = true

[[pattern]]
id = 'kbd-compat'
fixed = 'keyboard_compat'

[[pattern]]
id = 'cells-sync'
regex = 'synchronous (MountedData|handle|scroll_to)|synchronous[^.\n]{0,60}scroll_to'
ignore_case = true

[[pattern]]
id = 'upstream-res'
regex = 'res-3v42legm|Upstream sync ahead of determinism'
ignore_case = true

[[pattern]]
id = 'ci-run'
regex = 'CI#4(1914044942|1929821777|2371051720)'

[[pattern]]
id = 'title'
fixed = 'MountedData buffered render'
ignore_case = true

[[pattern]]
id = 'owner-generic'
regex = 'owned by a (route entry|CARRY)'
ignore_case = true
