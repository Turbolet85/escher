# The retired claims of this pass, by wording and by mechanism, and the old coordinates of every
# citation the chunk's edits moved. Derived from all amendments of the pass before the first sweep.

[[pattern]]
id = "five-verbs"
regex = 'five verbs|its five verbs'

[[pattern]]
id = "verb-list"
regex = '`press`,? (·|and) `advance`|`press`, `advance`\)'

[[pattern]]
id = "four-acting"
fixed = 'four acting'

[[pattern]]
id = "yet-returns"
regex = 'yet returns|four of them returned|by nothing yet|returns two more|two causes it returns'

[[pattern]]
id = "keeps-no-id"
regex = 'keeps no id|anew on every call|optional step only'

[[pattern]]
id = "not-found-only"
regex = 'refused `not-found`|looked up among|resolve their id first'

[[pattern]]
id = "click-runs"
regex = 'A click on a disabled|centre of the node.s border box|is accepted, while an id'

[[pattern]]
id = "named-only"
regex = 'named and worded only|nothing yet detect|named and worded, not detected'

[[pattern]]
id = "six-act"
regex = 'six driver-action|six `stand_act|six files `stand_act'

[[pattern]]
id = "readers"
regex = '11 readers|by 11 checks|eleven of those twelve|eleven of which'

[[pattern]]
id = "counts"
regex = '26 inline unit tests|, 17 tests|\(17\)|other 13, 12 pin|26 rows|34 rows|other 7;'

[[pattern]]
id = "one-scroller"
regex = 'clamp to one scroller|programmatic scrolls clamp'

[[pattern]]
id = "outcome-list"
regex = '`Outcome::Acted` (and|or) `Outcome::Advanced`|diff, advanced_ms \}'

[[pattern]]
id = "bounds-claim"
fixed = 'viewport-relative, unclamped'

[[pattern]]
id = "cite-scroll"
regex = 'scrolling\.rs:(620-626|712-722|674-678|732-746|724-747|663-666)\b'

[[pattern]]
id = "cite-execute"
regex = 'execute\.rs:(15-43|60-96|100-177|63|108|125-134|179-209)\b'

[[pattern]]
id = "cite-session"
regex = 'escher-driver/src/session\.rs:(11-99|40-98|11-52|101-123)\b'

[[pattern]]
id = "cite-schema"
regex = 'command\.rs:(161|234-572)\b|refusal\.rs:(115-126|144-147|187-314)\b|schema\.rs:277-444|escher-driver/src/lib\.rs:(33-57|35-57)\b'

[[pattern]]
id = "cite-harness"
regex = 'input\.rs:(227-232|95-239|18-27|75-93)\b'

[[pattern]]
id = "cite-common"
regex = 'session_common/mod\.rs:(194-202|205-269|190-202|195|184-269|1-269)\b'

[[pattern]]
id = "cite-checks"
regex = 'stand_act_ids\.rs:1-10|stand_act_refused\.rs:1-7'
