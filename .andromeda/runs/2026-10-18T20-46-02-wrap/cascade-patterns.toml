[[pattern]]
id = 'prov'
fixed = 'PROVISIONAL'

[[pattern]]
id = 'deleg'
regex = "founder's delegate|delegate operator|as the founder's delegate|in the founder's stead"
ignore_case = true

[[pattern]]
id = 'batch'
regex = "founder's epoch batch|for the founder's (epoch )?batch|unratified"
ignore_case = true
