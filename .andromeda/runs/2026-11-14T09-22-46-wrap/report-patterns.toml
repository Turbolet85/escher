# P1 site sweep — one pattern per moved fact, each carrying the fact's name token
[[pattern]]
id = 'xos-readings'
regex = '''stand_cross_os_readings|cross-OS|cross OS|across (OSes|operating systems|the three OSes)|different operating systems|answer_digest|no-shot-in-cross-os-byte-checks|no-screenshot-in-cross-os-byte-check'''
ignore_case = true

[[pattern]]
id = 'bundled-typo'
regex = '''stand-typography-dejavu-sans|stand-uses-bundled-font|stand-checks-bundled-font|DejaVu Sans|bundled (font|set|typography)'''
ignore_case = true

[[pattern]]
id = 'families'
regex = '''stand_bundled_font_families|unavailable-families-use-default-font|build_single_font_ctx|generic famil|every generic|cursive|fantasy|system-ui'''
ignore_case = true

[[pattern]]
id = 'counter-xos'
regex = '''counter-(cli|mcp)\.json[^.]*(windows|macos|three OS)|committed Counter checks?[^.]*(windows|macos|every OS|replay)|stand_replay'''
ignore_case = true

[[pattern]]
id = 'canvas-text'
regex = '''GlyphRun|canvas text|font_ctx|font context'''
ignore_case = true
