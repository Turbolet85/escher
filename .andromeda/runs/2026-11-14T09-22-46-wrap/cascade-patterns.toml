# Cascade step 2 — main's patterns for the two retired claims, spanning every master
[[pattern]]
id = 'registered-all'
regex = '''registered (for|to|under) (every|each|all) generic|(every|each|all) generic famil[a-z]*[^.]{0,40}registered|DejaVu Sans[^.]{0,60}(for|to) (every|each|all) generic famil|stand-typography-dejavu-sans'''
ignore_case = true

[[pattern]]
id = 'unix-only'
regex = '''runs on unix only|unix[- ]only|driver-session-unix-socket-only|session[^.]{0,40}(unix|linux and macOS) only'''
ignore_case = true
