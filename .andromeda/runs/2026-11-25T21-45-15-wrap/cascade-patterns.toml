[[pattern]]
id = 'UNCOUNTED'
regex = 'not counted|uncounted|handlers? inside a canvas|canvas handlers? (are )?not'
ignore_case = true

[[pattern]]
id = 'PIXELS'
regex = 'reach no (DOM|snapshot)|pixels[- ]only|circles and diameter labels'
ignore_case = true

[[pattern]]
id = 'NOVNODE'
regex = 'declares no virtual node|declare no virtual node'
ignore_case = true

[[pattern]]
id = 'THREEREADS'
regex = 'graph, actions and layout answers|actions answer and the layout answer|these three never'

[[pattern]]
id = 'XYD'
regex = 'x,y,d per circle|x, ?y, ?d\b'
