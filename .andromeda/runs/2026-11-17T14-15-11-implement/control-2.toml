[[control]]
id = "svg-image-fetch"
entry = 10
guard = "7b8712cba's SVG arm of load_image removed: an SVG element's href is read as none, so no image fetch is made for an SVG <image> (the <img> arm unchanged)"
case = "every_engine_request_carries_its_document_as_initiator"

[[control.edit]]
path = "packages/blitz-dom/src/mutator.rs"
old = '''
            element
                .svg_href()
                .filter(|href| !href.starts_with('#') && !is_data_url(href))
'''
new = '''
            None
'''
