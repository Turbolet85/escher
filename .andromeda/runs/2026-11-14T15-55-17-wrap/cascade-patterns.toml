[[pattern]]
id = 'main-1'
regex = '"app":(<label>|…|\.\.\.)\}\}|opens with the app label|the app label, then per answered call|two-key (opening|start) record'

[[pattern]]
id = 'main-2'
regex = '[Ee]ight unit-test modules|[Ee]ight `?#\[path\]`? (test )?(children|modules)'

[[pattern]]
id = 'main-3'
regex = 'is no check or is a check of another app'
