# The step-2 sweep of 2026-10-25-cold-agent-bar's wrap P2: each pattern the OLD wording of an amended claim — its
# phrasings and verbs, not only its token — run over the seven masters, their sets, the registries, the leaves,
# the curation homes and the judgment bases.

# F1 — escher-session serves four lean tasks (now six).
[[pattern]]
id = 'four-tasks'
regex = 'four lean (stand )?(tasks|apps)|one lean task|four slugs|over the four|all four tasks|on four tasks|the four tasks|four-entry table'
ignore_case = true

# F2 — the flight booker's two mode buttons (retired for the select).
[[pattern]]
id = 'mode-buttons'
regex = 'flight-one-way|flight-return(?!-date)|mode buttons?|active flight mode|flight-mode click|toggle buttons?'
ignore_case = true

# F18 — the stand states aria-pressed (it states none).
[[pattern]]
id = 'stand-pressed'
regex = 'three kinds of control|reads pressed|pressed reading|which control is pressed'
ignore_case = true

# F3 — the lint at boot reads 0 on each lean task.
[[pattern]]
id = 'lint-zero'
regex = '0 findings|no finding|reads clean to the visual lint|lints? clean'
ignore_case = true

# F4 — the stand's controls 15, rows 18.
[[pattern]]
id = 'controls-15'
regex = '15 (interactive )?controls|18 rows|18 control rows|those 15'
ignore_case = true

# F5 — STATE_ROWS 19, return-chosen 3, 17 measured rows, pass 14.
[[pattern]]
id = 'state-rows-19'
regex = '19 (reached|colour) states|19 `STATE_ROWS`|STATE_ROWS`, 19|return-chosen 3|17 measured rows|pass 14\b|five accent controls'
ignore_case = true

# F6 — stand_act_ids' census 70 · 7.
[[pattern]]
id = 'census-70'
regex = 'accepted on 70|70 of the 77|refused on (the )?7\b|the 12 controls'
ignore_case = true

# F7 — stand_keyboard's 20 activation rows, 14 tests.
[[pattern]]
id = 'activation-20'
regex = '\(20 rows|20 rows stated|stand_keyboard`? 14|stand_keyboard 14'
ignore_case = true

# F8 — the a11y leg 84 tests.
[[pattern]]
id = 'a11y-84'
regex = '84 (tests|passed)'
ignore_case = true

# F9 — the ci-scripts leg 104, test_cold_agent.py 33.
[[pattern]]
id = 'ci-scripts-104'
regex = '104 tests|Ran 104|test_cold_agent\.py.s 33|test_cold_agent\.py, 33|\(§4, 33\)'
ignore_case = true

# F10 — run stand 48 files, 197 passed.
[[pattern]]
id = 'run-stand-48'
regex = '48 files|48 `stand_|197 · 0 · 7|passed 197'
ignore_case = true

# F11 · F12 — the workspace tally and the coverage readings.
[[pattern]]
id = 'tally-coverage'
regex = '1105 passed|85\.57|94\.15'
ignore_case = true

# F13 — the host's own-sink part read unmeasured.
[[pattern]]
id = 'host-part'
regex = 'none pages|none paging|boots only the four|host_log` \(3 tests|host_log` holds 3|host_log 3'
ignore_case = true

# F14 — the pipe: four apps, wrong_calls deciding nothing.
[[pattern]]
id = 'pipe'
regex = 'four-app|deciding nothing|never deciding|all four lean apps|tasks_met` all four'
ignore_case = true

# F15 — the live run: one run, 43 calls, eleven tools, 2.1.296, not re-fired.
[[pattern]]
id = 'live-run'
regex = 'one live run|not re-fired|43 tool calls|0\.3197|2\.1\.296|eleven `?mcp__escher'
ignore_case = true

# F17 — the stand offline whole.
[[pattern]]
id = 'stand-offline'
regex = 'boots offline|offline on its bundled font|stand offline|the stand.s\) and a document|— the stand.s —'
ignore_case = true

# F20 — WITNESSES_020 46 witnesses.
[[pattern]]
id = 'witnesses-46'
regex = '46 witnesses'
ignore_case = true

# Reader counts: session_common 29, blitz-tests 145 .rs files.
[[pattern]]
id = 'readers-29'
regex = 'by 29\b|29 checks|29 readers|145 `\.rs`|144 test targets'
ignore_case = true

# The pipe's state set without record/.
[[pattern]]
id = 'state-set'
regex = 'server\.log, check\.json\}'
ignore_case = true
