# Site sweep — 2026-11-17-layout-on-the-carriers (wrap P1). One pattern per moved fact, its name token beside it.

[[pattern]]
id = 'verbs14'
regex = '''(fourteen|fifteen) (driver )?(verbs|commands|tools)|\bVERBS\b|verb table of (fourteen|fifteen)'''
ignore_case = true

[[pattern]]
id = 'inst10'
regex = '''(ten|eleven|tenth|eleventh) instance verbs?|instance verbs?,? (ten|eleven)'''
ignore_case = true

[[pattern]]
id = 'mcptools'
regex = '''(fourteen|fifteen) (MCP )?tools|tool listing|`help` last|help last'''
ignore_case = true

[[pattern]]
id = 'fieldkind'
regex = '''FieldKind|(thirteen|seventeen) (field |result )?kinds'''

[[pattern]]
id = 'describe'
regex = '''describe\(\)|`help`'s|self-description'''

[[pattern]]
id = 'actverbs'
regex = '''actions answer|actions`?'s line|"verbs"|verb words|(four|five) verbs per node'''

[[pattern]]
id = 'cellsbytes'
regex = '''106[,_]?088|118[,_]?292'''

[[pattern]]
id = 'crossos'
regex = '''stand_cross_os_readings|answer digests|cross-os-readings|(twelve|36) .?actions.? digests'''
ignore_case = true

[[pattern]]
id = 'actspans'
regex = '''stand_act_spans|calls per mode'''

[[pattern]]
id = 'tunit'
regex = '''escher-driver('s)? unit tests|\b12[23] (unit )?tests'''

[[pattern]]
id = 'tlayout'
fixed = 'stand_layout'

[[pattern]]
id = 'tmcptools'
fixed = 'stand_mcp_tools'

[[pattern]]
id = 'treplay'
fixed = 'stand_replay'

[[pattern]]
id = 'tcli'
fixed = 'cli_commands'

[[pattern]]
id = 'tmcpserver'
regex = '''\bmcp_server\b'''

[[pattern]]
id = 'fixtures'
regex = '''mod fixtures|fixtures/mod\.rs|fixtures readers?'''

[[pattern]]
id = 'usage'
regex = '''usage line|layout --id|usage error|missing `?--id'''

[[pattern]]
id = 'renames'
regex = '''the_fourteen_verbs_are_named|the_listing_is_the_fourteen_verbs|with_no_image\b|left_out_by_its_field_not_its_name'''

[[pattern]]
id = 'coldagent'
regex = '''cold-agent pipe|cold-agent\.sh|test_cold_agent'''

[[pattern]]
id = 'inprocess'
regex = '''layout-read-in-process-only|session-layout-read-in-process|Session::layout|LayoutExplanation|layout_reason|in process alone'''

[[pattern]]
id = 'verbrows'
regex = '''reading-verbs|kept-verbs|explored-verbs|verb-table'''

[[pattern]]
id = 'screenread'
regex = '''socket-carries-screen-reading'''

[[pattern]]
id = 'spans'
regex = '''layout-read-opens-no-span|command-span|tool-call-span|`command` span|tool_call'''

[[pattern]]
id = 'sesslayout'
regex = '''session-layout\b|changes-nothing'''

[[pattern]]
id = 'escsession'
regex = '''escher-session-(command|commands|mcp|actions)\b'''
