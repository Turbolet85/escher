[[pattern]]
id = 'readme-epochs'
regex = '''epoch bullets?|(planned|built),? in (six|five) stages|one bullet per epoch'''
ignore_case = true

[[pattern]]
id = 'readme-heads'
regex = '''status headings?|README'?s? `?## Status|### 0\.[1-4]\.0 — '''
ignore_case = true

[[pattern]]
id = 'readme-later'
regex = '''`?Later:`? line|README'?s? Later|Out of this version'''
ignore_case = true
