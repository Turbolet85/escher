[[control]]
id = 'no-default-seed'
entry = 3
guard = "Harness::from_vdom's provide of SeededRandom::from_seed(DEFAULT_SEED) where the vdom holds none"

[[control.edit]]
path = 'packages/blitz-test-harness/src/harness.rs'
old = '            vdom.provide_root_context(SeededRandom::from_seed(DEFAULT_SEED));'
new = '            let _ = (SeededRandom::from_seed(DEFAULT_SEED), &vdom);'

[[control]]
id = 'below-constant'
entry = 3
guard = "SeededRandom::below's draw: the value returned for a bound"

[[control.edit]]
path = 'packages/dioxus-native-dom/src/seed.rs'
old = '        u64::try_from(product >> 64).unwrap_or(0)'
new = '        u64::try_from(product >> 64).map(|_| 0).unwrap_or(0)'
