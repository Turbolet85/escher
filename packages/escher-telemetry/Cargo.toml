[package]
name = "escher-telemetry"
description = "Telemetry bootstrap for escher binaries: stderr tracing subscriber, service identity, panic logging and an allowlist scrub"
publish = false
version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
categories.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt", "registry", "std", "tracing-log"] }
tracing-log = { workspace = true }
