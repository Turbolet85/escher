name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - v0.*
      - build/**

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Every job only checks out, restores or saves caches and uploads artifacts.
permissions:
  contents: read

env:
  RUSTDOCFLAGS: "-D warnings"
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: "sparse"

# Every linux leg runs through .github/scripts/ci-leg.sh, which the dev host runs too
# (`bash .github/scripts/ci-leg.sh fast` is the local pre-push gate). The fast legs (fmt, clippy,
# test-features-default, ci-scripts) carry no `needs`; every slower leg waits on all four.
jobs:

  # MSRV check.
  # Blitz only guarantees "latest stable". However we have this check here to ensure that we advertise
  # our MSRV. We also make an effort not to increase MSRV in patch versions of Blitz.
  #
  # We only run `cargo build` (not `cargo test`) so as to avoid requiring dev-dependencies to build with the MSRV
  # version. Building is likely sufficient as runtime errors varying between rust versions is very unlikely.
  build-msrv:
    name: "MSRV Build [Rust 1.91]"
    runs-on: ubuntu-latest
    needs: [fmt, clippy, test-features-default, ci-scripts]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.91
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/build/') }}
      - run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
      - run: bash .github/scripts/ci-leg.sh msrv
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: ci-log-build-msrv
          path: target/ci-logs/msrv.log
          retention-days: 7
          if-no-files-found: ignore

  build-features-default:
    name: "Build [default features]"
    runs-on: ubuntu-latest
    needs: [fmt, clippy, test-features-default, ci-scripts]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/build/') }}
      - run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
      - run: bash .github/scripts/ci-leg.sh build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: ci-log-build-features-default
          path: target/ci-logs/build.log
          retention-days: 7
          if-no-files-found: ignore

  test-features-default:
    name: "Test [default features]"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: workspace-test
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/build/') }}
      - run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
      - run: bash .github/scripts/ci-leg.sh test
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: ci-log-test-features-default
          path: target/ci-logs/test.log
          retention-days: 7
          if-no-files-found: ignore

  build-counter:
    name: "Build counter example"
    runs-on: ubuntu-latest
    needs: [fmt, clippy, test-features-default, ci-scripts]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/build/') }}
      - run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
      - run: bash .github/scripts/ci-leg.sh counter
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: ci-log-build-counter
          path: target/ci-logs/counter.log
          retention-days: 7
          if-no-files-found: ignore

  # wasm_hello is a standalone workspace; seven_guis and todomvc are workspace
  # members with a [lib] crate-type = ["cdylib"] target for wasm.
  build-wasm-examples:
    name: "Build wasm examples"
    runs-on: ubuntu-latest
    needs: [fmt, clippy, test-features-default, ci-scripts]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/build/') }}
      - run: bash .github/scripts/ci-leg.sh wasm
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: ci-log-build-wasm-examples
          path: target/ci-logs/wasm.log
          retention-days: 7
          if-no-files-found: ignore

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
          components: rustfmt
      - run: bash .github/scripts/ci-leg.sh fmt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: ci-log-fmt
          path: target/ci-logs/fmt.log
          retention-days: 7
          if-no-files-found: ignore

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/build/') }}
      - run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
      - run: bash .github/scripts/ci-leg.sh clippy
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: ci-log-clippy
          path: target/ci-logs/clippy.log
          retention-days: 7
          if-no-files-found: ignore

  ci-scripts:
    name: "Test CI scripts"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python3 -c 'import yaml' || (sudo apt-get update && sudo apt-get install -y python3-yaml)
      - run: bash .github/scripts/ci-leg.sh ci-scripts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: ci-log-ci-scripts
          path: target/ci-logs/ci-scripts.log
          retention-days: 7
          if-no-files-found: ignore

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    needs: [fmt, clippy, test-features-default, ci-scripts]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/build/') }}
      - run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
      - run: bash .github/scripts/ci-leg.sh doc
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: ci-log-doc
          path: target/ci-logs/doc.log
          retention-days: 7
          if-no-files-found: ignore

  # The gate legs below sit in the slow tier, so an advisory-database red never blocks the other
  # slow legs. None of them saves a cache entry: the fork's Actions cache is near its 10 GB budget.
  audit:
    name: "Dependency audit"
    runs-on: ubuntu-latest
    needs: [fmt, clippy, test-features-default, ci-scripts]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
      - uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2
        with:
          tool: cargo-deny@0.20.2
      - run: bash .github/scripts/ci-leg.sh audit
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: ci-log-audit
          path: target/ci-logs/audit.log
          retention-days: 7
          if-no-files-found: ignore

  # Restores the test job's cache (same shared key, same feature resolution) and never saves.
  a11y:
    name: "Accessibility (a11y) tests"
    runs-on: ubuntu-latest
    needs: [fmt, clippy, test-features-default, ci-scripts]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: workspace-test
          save-if: false
      - run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
      - run: bash .github/scripts/ci-leg.sh a11y
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: ci-log-a11y
          path: target/ci-logs/a11y.log
          retention-days: 7
          if-no-files-found: ignore

  # Uncached: an instrumented target would evict the other legs' cache entries.
  coverage:
    name: "Coverage report"
    runs-on: ubuntu-latest
    needs: [fmt, clippy, test-features-default, ci-scripts]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2
        with:
          tool: cargo-llvm-cov@0.9.1
      - run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
      - run: bash .github/scripts/ci-leg.sh coverage
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: success()
        with:
          name: coverage-report
          path: target/coverage/
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: ci-log-coverage
          path: target/ci-logs/coverage.log
          retention-days: 7
          if-no-files-found: ignore

  # Linux is tested by the fast test-features-default leg (doctests included), so the matrix
  # carries no linux entry.
  matrix_test:
    runs-on: ${{ matrix.platform.os }}
    needs: [fmt, clippy, test-features-default, ci-scripts]
    env:
      RUST_CARGO_COMMAND: ${{ matrix.platform.cross == true && 'cross' || 'cargo' }}
      RUSTFLAGS: ${{ matrix.platform.name == 'ios' && '-Clink-arg=-target -Clink-arg=arm64-apple-ios18.4 -Clink-arg=-miphoneos-version-min=18.4' || '' }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - {
              name: windows,
              target: x86_64-pc-windows-msvc,
              os: windows-latest,
              cross: false,
              command: "test",
              args: "--all --tests",
            }
          - {
              name: macos,
              target: aarch64-apple-darwin,
              os: macos-latest,
              cross: false,
              command: "test",
              args: "--all --tests",
            }
          - {
              name: ios,
              target: aarch64-apple-ios,
              os: macos-latest,
              cross: false,
              command: "build",
              args: "--all",
            }
          - {
              name: android,
              target: aarch64-linux-android,
              os: ubuntu-latest,
              cross: true,
              command: "build",
              args: "--all",
            }

    name: Test (${{ matrix.platform.name }})

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: install stable
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
          targets: ${{ matrix.platform.target }}
          components: rustfmt

      # Install cross from source. Because latest release doesn't work with recent Rust
      # when targeting Android. See https://github.com/cross-rs/cross/issues/1222
      - name: Install cross
        if: ${{ matrix.platform.cross == true }}
        run: cargo install cross --git https://github.com/cross-rs/cross --rev 426e811

      - name: Free Disk Space (Ubuntu)
        if: ${{ matrix.platform.os == 'ubuntu-24.04' || matrix.platform.os == 'ubuntu-24.04-arm' }}
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with: # speed things up a bit
          android: ${{ matrix.platform.target != 'aarch64-linux-android' }}
          large-packages: false
          swap-storage: false

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: "${{ matrix.platform.target }}"
          cache-all-crates: "true"
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/build/') }}
          cache-bin: ${{ matrix.platform.os != 'macos-latest' }} # works around https://github.com/Swatinem/rust-cache/issues/341

      - name: Install apt deps
        if: ${{ matrix.platform.os == 'ubuntu-latest' }}
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # latest
        with:
          packages: libfontconfig1-dev
          version: 1.0

      - name: Setup
        run: ${{ matrix.platform.setup }}
        shell: bash

      - name: test
        shell: bash
        run: |
          mkdir -p target/ci-logs
          ${{ env.RUST_CARGO_COMMAND }} ${{ matrix.platform.command }} ${{ matrix.platform.args }} --target ${{ matrix.platform.target }} --locked 2>&1 | tee "target/ci-logs/matrix-${{ matrix.platform.name }}.log"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: ci-log-matrix-${{ matrix.platform.name }}
          path: target/ci-logs/matrix-${{ matrix.platform.name }}.log
          retention-days: 7
          if-no-files-found: ignore
