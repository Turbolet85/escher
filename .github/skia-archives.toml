# skia-bindings' prebuilt archives, one per platform CI builds, each pinned to the sha256 of the release asset.
# `.github/scripts/skia_archive.py` fetches the archive once, checks it against this record and hands the build its
# local copy through SKIA_BINARIES_URL. `tag` follows skia-bindings' version in Cargo.lock (test_skia_archive.py
# holds them equal), so a skia move reads red until every key and sum here is measured again by hand.

tag = "0.157.0"
url = "https://github.com/rust-skia/skia-binaries/releases/download/{tag}/skia-binaries-{key}.tar.gz"

[targets."x86_64-unknown-linux-gnu"]
key = "30669978c3f39a73e8a7-x86_64-unknown-linux-gnu-ganesh-gl-jpegd-jpege-pdf"
sha256 = "bc92c2fb1d5f6bf4f681e57d3b3796d8c657157f6d75c53793b28723949f5399"

[targets."aarch64-apple-darwin"]
key = "30669978c3f39a73e8a7-aarch64-apple-darwin-ganesh-jpegd-jpege-metal-pdf"
sha256 = "ab57f2687668da89df7dd1e1b625eb2756dc97f18241c52a0367e794decb89b0"

