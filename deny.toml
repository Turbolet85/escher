# cargo-deny configuration for the `audit` leg (`bash .github/scripts/ci-leg.sh audit`, which runs
# `cargo deny --locked --workspace --all-features check advisories licenses`): the advisories and the
# licences of the whole workspace's graph. The `[licenses]` table is upstream's.

[graph]
# Every platform ci.yml builds, with every feature on, so the audit sees each graph a user can build.
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
    "aarch64-apple-ios",
    "aarch64-linux-android",
    "wasm32-unknown-unknown",
]
all-features = true

[advisories]
# Per-ID ignores only, each a bounded deferral: the audit leg re-reads the advisory database on every
# push, so a new advisory, or a fix landing upstream, surfaces at the next run.
ignore = [
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser 0.25.1 is unmaintained, no patched release exists; it reaches the graph only through winit 0.31.0-beta.4 -> winit-wayland -> sctk-adwaita -> ab_glyph -> owned_ttf_parser, and winit is an exact coupled pin (CLAUDE.md), so no fix is reachable without a winit bump; a wait on a winit 0.31 beta chain release that leaves ttf-parser 0.25.1 (winit-wayland, sctk-adwaita, ab_glyph and owned_ttf_parser are each their latest); owned by the residual row res-y4gizreq that drops this ignore when a winit 0.31 beta chain release leaves ttf-parser 0.25.1; re-checked by the audit leg on every push" },
    { id = "RUSTSEC-2024-0436", reason = "paste 1.0.15 is unmaintained, no patched release exists; it reaches the graph only as a proc-macro of rav1e 0.8.1 -> ravif -> image, through anyrender_svg and the apps' avif feature; owned by the residual row res-kdhnfj5p that drops this ignore when that chain leaves paste; re-checked by the audit leg on every push" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant 5.15.0 is unmaintained, folded into zbus 6.0.0 (z-galaxy/zbus#2043); it reaches the graph only through zbus 5.19 + atspi 0.29 under accesskit_unix 0.24.1 (the latest, requiring zbus ^5.19) <- accesskit_xplat <- blitz-shell, so no fix is reachable; owned by the residual row res-p73cueyv that drops this ignore when accesskit_unix moves to zbus 6; re-checked by the audit leg on every push" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names 4.3.4 is unmaintained, folded into zbus 6.0.0 (z-galaxy/zbus#2043); it reaches the graph only through zbus 5.19 + atspi 0.29 under accesskit_unix 0.24.1 (the latest, requiring zbus ^5.19) <- accesskit_xplat <- blitz-shell, so no fix is reachable; owned by the residual row res-p73cueyv that drops this ignore when accesskit_unix moves to zbus 6; re-checked by the audit leg on every push" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive 5.15.0 is unmaintained, folded into zbus 6.0.0 (z-galaxy/zbus#2043); it reaches the graph only through zbus 5.19 + atspi 0.29 under accesskit_unix 0.24.1 (the latest, requiring zbus ^5.19) <- accesskit_xplat <- blitz-shell, so no fix is reachable; owned by the residual row res-p73cueyv that drops this ignore when accesskit_unix moves to zbus 6; re-checked by the audit leg on every push" },
    { id = "RUSTSEC-2026-0459", reason = "libsqlite3-sys 0.30.1 is reached only through rusqlite 0.32 <- browser-persistence <- browser (and rusqlite_migration 1.3); the browser opens only its own history.sqlite3 in its project data dir, or an in-memory database; the fix (libsqlite3-sys >= 0.39, rusqlite >= 0.41) is not semver-compatible with the pinned rusqlite 0.32, and upstream's own lock carries the same libsqlite3-sys 0.30.1; owned by the residual row res-j4x7iiqc, it drops when an upstream sync brings rusqlite >= 0.41; re-checked by the audit leg on every push" },
]

[licenses]
include-dev = true
include-build = true
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    # File-level copyleft; commercial-distribution obligations: docs/licensing.md.
    "MPL-2.0",
    "NCSA",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]
