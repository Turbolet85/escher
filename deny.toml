# cargo-deny configuration for the `audit` leg (`bash .github/scripts/ci-leg.sh audit`, which runs
# `cargo deny --locked check advisories`). The `[licenses]` table is upstream's and no leg runs it yet.

[graph]
# Every platform ci.yml builds, with every feature on, so the audit sees each graph a user can build.
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
    "aarch64-apple-ios",
    "aarch64-linux-android",
    "wasm32-unknown-unknown",
]
all-features = true

[advisories]
# Per-ID ignores only, each a bounded deferral: the audit leg re-reads the advisory database on every
# push, so a new advisory, or a fix landing upstream, surfaces at the next run.
ignore = [
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser 0.25.1 is unmaintained, no patched release exists; it reaches the graph only through winit 0.31.0-beta.3 -> winit-wayland -> sctk-adwaita -> ab_glyph -> owned_ttf_parser, and winit is an exact coupled pin (CLAUDE.md), so no fix is reachable without a winit bump; re-checked by the audit leg on every push" },
]

[licenses]
include-dev = true
include-build = true
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    # File-level copyleft; commercial-distribution obligations: docs/licensing.md.
    "MPL-2.0",
    "NCSA",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]
